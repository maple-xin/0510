<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
<title>Face Reaction Lab Sound</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070913;color:#fff;font-family:Arial,Helvetica,sans-serif;touch-action:none}body{display:flex;justify-content:center;align-items:center}#app{width:100vw;height:100vh;max-width:520px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 8%,rgba(120,150,255,.18),transparent 36%),linear-gradient(180deg,#11182a 0%,#1c2540 50%,#080912 100%)}canvas{width:100%;height:100%;display:block}.top{position:absolute;top:14px;left:14px;right:14px;z-index:5;display:grid;grid-template-columns:1fr 1fr 1fr 44px;gap:8px}.pill,.help{height:38px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;letter-spacing:.8px;box-shadow:0 8px 22px rgba(0,0,0,.25)}.help{font-size:18px;color:#fff}#title{position:absolute;top:62px;left:0;right:0;text-align:center;font-size:22px;font-weight:1000;letter-spacing:3px;text-shadow:0 8px 22px rgba(0,0,0,.45);z-index:4;pointer-events:none}.guide{position:absolute;left:16px;right:16px;bottom:18px;z-index:5;background:rgba(7,10,20,.72);border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:14px 16px;text-align:center;box-shadow:0 16px 40px rgba(0,0,0,.34);pointer-events:none}.gt{font-size:15px;line-height:1.35;font-weight:900;color:rgba(255,255,255,.9);margin-bottom:10px}.bw{height:12px;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden}.bar{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#f9a8d4,#60a5fa,#facc15)}.ov{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;text-align:center;padding:26px;background:rgba(4,7,14,.78);backdrop-filter:blur(10px)}.ov.hide{display:none}.card{width:100%;max-width:390px;border-radius:30px;padding:26px 22px;background:rgba(15,23,42,.84);border:1px solid rgba(255,255,255,.16);box-shadow:0 24px 80px rgba(0,0,0,.48)}h1{margin:0 0 12px;font-size:34px;line-height:1;font-weight:1000;letter-spacing:1.5px}p{margin:0 auto 22px;color:rgba(255,255,255,.83);font-size:15px;line-height:1.45}button{border:0}#start{width:190px;height:54px;border-radius:999px;background:linear-gradient(135deg,#f9a8d4,#fb7185 45%,#facc15);color:#101018;font-size:18px;font-weight:1000;box-shadow:0 12px 34px rgba(251,113,133,.35)}button:active{transform:scale(.96)}#toast{position:absolute;left:50%;top:104px;transform:translateX(-50%);z-index:8;padding:8px 14px;border-radius:999px;background:rgba(0,0,0,.56);border:1px solid rgba(255,255,255,.16);font-size:13px;font-weight:900;opacity:0;transition:.16s;pointer-events:none;white-space:nowrap}#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
<canvas id="c"></canvas>
<div class="top"><div class="pill">LEVEL&nbsp;<span id="lv">1</span></div><div class="pill">SCORE&nbsp;<span id="sc">0</span></div><div class="pill">MOOD&nbsp;<span id="mood">CALM</span></div><button class="help" id="help">?</button></div>
<div id="title">FACE REACTION LAB</div>
<div class="guide"><div class="gt" id="guide">Drag your finger. The eyes will follow.</div><div class="bw"><div class="bar" id="bar"></div></div></div>
<div class="ov" id="ov"><div class="card"><h1 id="ot">FACE REACTION</h1><p id="op">Sound version. Tap START to unlock music and sound.<br>Level 1 eyes follow. Level 2 feather tickles nose. Level 3 ear pick cleans ear.</p><button id="start">START</button></div></div>
<div id="toast">Nice!</div>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),lvT=document.getElementById('lv'),scT=document.getElementById('sc'),moodT=document.getElementById('mood'),guideT=document.getElementById('guide'),bar=document.getElementById('bar'),ov=document.getElementById('ov'),ot=document.getElementById('ot'),op=document.getElementById('op'),startBtn=document.getElementById('start'),helpBtn=document.getElementById('help'),toast=document.getElementById('toast');
let W=390,H=760,dpr=1,running=false,paused=false,level=1,progress=0,score=0,last=0,down=false,px=200,py=380,lpx=px,lpy=py,power=0,nose=0,ear=0,roll=0,blink=0,mood='CALM',lastEye=0,lastNose=0,lastEar=0;
const guides={1:'LEVEL 1: Drag anywhere. Make both eyes follow your finger.',2:'LEVEL 2: Drag the feather onto the nose and wiggle it.',3:'LEVEL 3: Drag the ear pick around either ear. The valid area is large.'};
const intros={1:['LEVEL 1','Drag your finger anywhere. The eyes will follow.'],2:['LEVEL 2','Drag the feather onto the nose. Wiggle near the nose.'],3:['LEVEL 3','Drag the ear pick around either ear. The ear and eyes react.']};
const audio={ctx:null,master:null,mg:null,sg:null,on:false,timer:null,step:0,init(){if(this.on)return;let A=window.AudioContext||window.webkitAudioContext;if(!A)return;this.ctx=new A();this.master=this.ctx.createGain();this.master.gain.value=.75;this.master.connect(this.ctx.destination);this.mg=this.ctx.createGain();this.mg.gain.value=.20;this.mg.connect(this.master);this.sg=this.ctx.createGain();this.sg.gain.value=.66;this.sg.connect(this.master);this.on=true;this.pop();this.music()},tone(f=440,d=.1,type='sine',g=.18,out=null,slide=0){if(!this.on)return;let t=this.ctx.currentTime,o=this.ctx.createOscillator(),gn=this.ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(g,t+.01);gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gn);gn.connect(out||this.sg);o.start(t);o.stop(t+d+.03)},noise(d=.08,g=.13,ff=1600){if(!this.on)return;let n=Math.floor(this.ctx.sampleRate*d),b=this.ctx.createBuffer(1,n,this.ctx.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);let s=this.ctx.createBufferSource(),fi=this.ctx.createBiquadFilter(),gn=this.ctx.createGain();fi.type='bandpass';fi.frequency.value=ff;gn.gain.value=g;s.buffer=b;s.connect(fi);fi.connect(gn);gn.connect(this.sg);s.start()},pop(){this.tone(560,.08,'triangle',.18);this.tone(920,.12,'sine',.12,null,100)},eye(){this.tone(230,.12,'sine',.14,null,260)},tickle(){this.noise(.045,.12,2500);this.tone(740,.05,'triangle',.09)},sniff(){this.tone(180,.09,'sawtooth',.11,null,-60)},ear(){this.noise(.07,.12,1800);this.tone(330,.06,'square',.07)},dizzy(){this.tone(650,.08,'sine',.10,null,-280);this.tone(380,.1,'sine',.08,null,180)},success(){this.tone(523,.08,'triangle',.16);setTimeout(()=>this.tone(659,.08,'triangle',.16),90);setTimeout(()=>this.tone(784,.14,'triangle',.18),180)},victory(){this.success();setTimeout(()=>this.tone(1046,.18,'sine',.16),280);setTimeout(()=>this.tone(1318,.24,'sine',.14),440)},music(){if(this.timer)return;let notes=[262,330,392,523,392,330,294,349,440,587,440,349];this.timer=setInterval(()=>{if(!this.on)return;let n=notes[this.step++%notes.length];this.tone(n,.15,'triangle',.055,this.mg);if(this.step%4===0)this.tone(n/2,.25,'sine',.035,this.mg)},260)}};
function resize(){dpr=window.devicePixelRatio||1;let r=canvas.getBoundingClientRect();W=Math.floor(r.width);H=Math.floor(r.height);canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
function reset(){level=1;progress=0;score=0;down=false;px=W/2;py=H/2;lpx=px;lpy=py;power=0;nose=0;ear=0;roll=0;blink=0;mood='CALM';paused=false;ui();draw()}
function ui(){lvT.textContent=level;scT.textContent=Math.floor(score);moodT.textContent=mood;guideT.textContent=guides[level];bar.style.width=Math.min(100,progress*100)+'%'}
function toastShow(t){toast.textContent=t;toast.classList.add('show');clearTimeout(toastShow.t);toastShow.t=setTimeout(()=>toast.classList.remove('show'),750)}
function intro(l){running=false;paused=false;ot.textContent=intros[l][0];op.innerHTML=intros[l][1]+'<br><br>Tap START to continue.';startBtn.textContent=l===1?'START':'START LEVEL '+l;ov.classList.remove('hide')}
function startGame(){audio.init();running=true;paused=false;ov.classList.add('hide');last=performance.now();requestAnimationFrame(loop)}
function next(){score+=100+level*50;audio.success();if(level<3){level++;progress=0;ui();intro(level)}else finish()}
function finish(){running=false;audio.victory();ot.textContent='STAGE CLEAR';op.innerHTML='Final score: '+Math.floor(score+300)+'<br>All reactions completed with sound!';startBtn.textContent='PLAY AGAIN';ov.classList.remove('hide')}
function loop(t){if(!running)return;let dt=Math.min(.034,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}
function dist(a,b,c,d){return Math.hypot(a-c,b-d)}
function update(dt){let now=performance.now(),dx=px-lpx,dy=py-lpy;power=Math.min(1,Math.hypot(dx,dy)/18);lpx=px;lpy=py;nose*=Math.pow(.01,dt);ear*=Math.pow(.01,dt);roll*=Math.pow(.03,dt);blink-=dt;if(blink<-2.8)blink=.14;let cx=W/2,fy=H*.48,nx=cx,ny=fy+28,lx=cx-145,rx=cx+145,ey=fy+10;if(level===1){mood=down?'CURIOUS':'CALM';if(down){progress+=dt*(.18+power*.28);if(power>.45&&now-lastEye>220){audio.eye();lastEye=now}}}if(level===2){let near=dist(px,py,nx,ny)<92;mood=near?'TICKLED':'WAIT';if(down&&near){progress+=dt*(.24+power*.64);nose=Math.min(1,nose+dt*5+power*.4);roll=Math.min(1,roll+dt*1.2);if(now-lastNose>150){audio.tickle();if(Math.random()>.68)audio.sniff();lastNose=now}}}if(level===3){let left=dist(px,py,lx,ey)<135||(px<W*.45&&py>H*.25&&py<H*.72),right=dist(px,py,rx,ey)<135||(px>W*.55&&py>H*.25&&py<H*.72),near=left||right;mood=near?'DIZZY':'FOCUS';if(down&&near){progress+=dt*(.35+power*.78);ear=Math.min(1,ear+dt*5+power*.5);roll=Math.min(1,roll+dt*3+power*.7);if(now-lastEar>135){audio.ear();if(Math.random()>.55)audio.dizzy();lastEar=now}}}if(progress>=1){progress=1;next()}score+=dt*4;ui()}
function bg(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#11182a');g.addColorStop(.55,'#1e2a46');g.addColorStop(1,'#080912');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(255,255,255,.06)';for(let i=0;i<7;i++){let x=(i*91+(performance.now()*.012)%91)%(W+90)-45,y=130+(i%3)*78;ctx.beginPath();ctx.arc(x,y,28,0,Math.PI*2);ctx.arc(x+30,y+8,22,0,Math.PI*2);ctx.arc(x-28,y+10,18,0,Math.PI*2);ctx.fill()}}
function earDraw(x,y,s,sh){ctx.save();ctx.translate(x,y);ctx.rotate(s*.14+sh*.018);ctx.fillStyle='#d89678';ctx.beginPath();ctx.ellipse(0,0,28,44,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#b66f62';ctx.beginPath();ctx.ellipse(s*3,4,13,25,0,0,Math.PI*2);ctx.fill();ctx.restore()}
function eyeDraw(x,y,lx,ly,b){ctx.fillStyle='#fff6ef';ctx.beginPath();ctx.ellipse(x,y,34,21*b,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#3b2522';ctx.lineWidth=3;ctx.stroke();let ex=x+lx*13,ey=y+ly*8;ctx.fillStyle='#2e4057';ctx.beginPath();ctx.arc(ex,ey,10*b,0,Math.PI*2);ctx.fill();ctx.fillStyle='#101018';ctx.beginPath();ctx.arc(ex,ey,5*b,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,255,255,.85)';ctx.beginPath();ctx.arc(ex-3,ey-3,2.5*b,0,Math.PI*2);ctx.fill()}
function face(){let cx=W/2,cy=H*.48,r=Math.min(W*.35,H*.20),lookX=Math.max(-1,Math.min(1,(px-cx)/(W*.32))),lookY=Math.max(-1,Math.min(1,(py-cy)/(H*.26))),ro=Math.sin(performance.now()*.018)*roll,no=Math.sin(performance.now()*.052)*9*nose,eo=Math.sin(performance.now()*.07)*12*ear,bs=blink>0?.18:1;ctx.fillStyle='#4b2d22';ctx.beginPath();ctx.arc(cx,cy-r*.45,r*1.08,Math.PI,Math.PI*2);ctx.fill();earDraw(cx-r*.94,cy+eo*.18,-1,eo);earDraw(cx+r*.94,cy-eo*.18,1,-eo);ctx.fillStyle='#e5aa86';ctx.beginPath();ctx.ellipse(cx,cy,r*.92,r*1.14,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,255,255,.18)';ctx.beginPath();ctx.ellipse(cx-r*.22,cy-r*.42,r*.52,r*.22,-.32,0,Math.PI*2);ctx.fill();ctx.fillStyle='#2e1e1b';for(let i=-4;i<=4;i++){ctx.beginPath();ctx.ellipse(cx+i*r*.17,cy-r*.95+Math.abs(i)*7,r*.18,r*.45,i*.08,Math.PI,Math.PI*2);ctx.fill()}eyeDraw(cx-r*.34,cy-r*.18,lookX+ro,lookY-ro,bs);eyeDraw(cx+r*.34,cy-r*.18,lookX-ro,lookY+ro,bs);ctx.fillStyle='#c9755d';ctx.beginPath();ctx.ellipse(cx+no,cy+r*.18,r*.12+nose*8,r*.20,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#7a3f35';ctx.beginPath();ctx.arc(cx-10+no,cy+r*.23,3+nose*2,0,Math.PI*2);ctx.arc(cx+10+no,cy+r*.23,3+nose*2,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#5a2d2d';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.arc(cx,cy+r*.42,r*.22,.15,Math.PI-.15);ctx.stroke();if(level===2&&nose>.2){ctx.fillStyle='rgba(255,255,255,.9)';ctx.font='900 22px Arial';ctx.textAlign='center';ctx.fillText('hehe!',cx,cy-r*1.15)}if(level===3&&ear>.2){ctx.fillStyle='rgba(255,255,255,.9)';ctx.font='900 20px Arial';ctx.textAlign='center';ctx.fillText('DIZZY!',cx,cy-r*1.15)}}
function tool(){if(level===2){let tx=down?px:W*.72,ty=down?py:H*.72;ctx.save();ctx.translate(tx,ty);ctx.rotate(-.55+Math.sin(performance.now()*.012)*.08);ctx.strokeStyle='#f8fafc';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(58,-42);ctx.stroke();let cs=['#f9a8d4','#facc15','#93c5fd','#fff'];for(let i=0;i<9;i++){ctx.fillStyle=cs[i%cs.length];ctx.beginPath();ctx.ellipse(58+i*2,-42-i*2,9+i*.8,22-i,.7,0,Math.PI*2);ctx.fill()}ctx.restore()}if(level===3){let tx=down?px:W*.74,ty=down?py:H*.70;ctx.save();ctx.translate(tx,ty);ctx.rotate(.8+Math.sin(performance.now()*.018)*.18);ctx.strokeStyle='#cbd5e1';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-40,0);ctx.lineTo(42,0);ctx.stroke();ctx.strokeStyle='#94a3b8';ctx.lineWidth=4;ctx.beginPath();ctx.arc(47,0,10,-1.2,1.2);ctx.stroke();ctx.fillStyle='#e2e8f0';ctx.beginPath();ctx.arc(-44,0,8,0,Math.PI*2);ctx.fill();ctx.restore()}}
function draw(){if(!ctx)return;bg();face();tool()}
function pos(e){let r=canvas.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:p.clientX-r.left,y:p.clientY-r.top}}
function pstart(e){e.preventDefault();if(!audio.on&&ov.classList.contains('hide'))audio.init();let p=pos(e);down=true;px=p.x;py=p.y;lpx=px;lpy=py}
function pmove(e){e.preventDefault();let p=pos(e);px=p.x;py=p.y}
function pend(e){e.preventDefault();down=false}
canvas.addEventListener('touchstart',pstart,{passive:false});canvas.addEventListener('touchmove',pmove,{passive:false});canvas.addEventListener('touchend',pend,{passive:false});canvas.addEventListener('mousedown',pstart);window.addEventListener('mousemove',e=>{if(down)pmove(e)});window.addEventListener('mouseup',pend);
startBtn.onclick=()=>{audio.init();if(startBtn.textContent==='PLAY AGAIN'){reset();startBtn.textContent='START';startGame();return}if(startBtn.textContent==='CLOSE'){ov.classList.add('hide');if(paused){paused=false;running=true;last=performance.now();requestAnimationFrame(loop)}return}startGame()};
helpBtn.onclick=()=>{audio.init();if(running){paused=true;running=false}ot.textContent='HOW TO PLAY';op.innerHTML=guides[level]+'<br><br>Sound is built into this HTML file.';startBtn.textContent='CLOSE';ov.classList.remove('hide');audio.pop()};
window.addEventListener('resize',resize);document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});resize();reset();
</script>
</body>
</html>
