<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
<title>Pocket Tower Defense</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1020;color:#fff;font-family:Arial,Helvetica,sans-serif;touch-action:none}body{display:flex;justify-content:center;align-items:center}#app{width:100vw;height:100vh;max-width:520px;padding:14px 12px 12px;background:radial-gradient(circle at 50% 10%,rgba(59,130,246,.22),transparent 35%),linear-gradient(#111827,#0f172a);display:flex;flex-direction:column;gap:8px}#top{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.stat{height:38px;border-radius:999px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;white-space:nowrap}#title{text-align:center;font-size:23px;font-weight:1000;letter-spacing:2px;text-shadow:0 6px 20px #000}#frame{flex:1;min-height:0;position:relative;padding:8px;border-radius:24px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);box-shadow:0 18px 60px rgba(0,0,0,.45)}canvas{width:100%;height:100%;display:block;border-radius:18px;background:#132033}#hint{position:absolute;left:50%;top:17px;transform:translateX(-50%);font-size:12px;font-weight:800;color:rgba(255,255,255,.75);background:rgba(0,0,0,.28);padding:6px 12px;border-radius:999px;pointer-events:none;white-space:nowrap}#panel{position:absolute;inset:8px;border-radius:18px;background:rgba(5,10,18,.84);backdrop-filter:blur(9px);display:flex;align-items:center;justify-content:center;text-align:center;padding:22px;z-index:10}#panel.hide{display:none}#panel h1{margin:0;font-size:36px;line-height:1;font-weight:1000;letter-spacing:1px}#panel p{margin:14px auto 22px;max-width:310px;font-size:15px;line-height:1.45;color:rgba(255,255,255,.82)}button{font-family:inherit;border:none;color:#fff;font-weight:1000}#start{height:52px;min-width:160px;border-radius:999px;background:linear-gradient(135deg,#facc15,#fb923c);color:#151515;font-size:18px;box-shadow:0 12px 34px rgba(251,146,60,.35)}#controls{display:flex;flex-direction:column;gap:8px}.row{display:grid;gap:8px}.towers{grid-template-columns:1fr 1fr 1fr}.bottom{grid-template-columns:1fr 1fr}.tower,.small{border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.09);border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,.25)}.tower{height:58px;font-size:12px;line-height:1.25}.small{height:42px;font-size:13px}.tower.active{background:linear-gradient(135deg,#facc15,#fb923c);color:#151515;border-color:rgba(255,255,255,.45)}button:active{transform:scale(.96)}#toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);padding:8px 14px;border-radius:999px;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.15);font-size:13px;font-weight:900;opacity:0;transition:.18s;z-index:20;white-space:nowrap}#toast.show{opacity:1}@media(max-height:720px){#title{font-size:19px}.stat{height:34px;font-size:12px}.tower{height:48px;border-radius:14px}.small{height:36px}}
</style>
</head>
<body>
<div id="app">
  <div id="top"><div class="stat">COINS: <span id="coins">120</span></div><div class="stat">WAVE: <span id="wave">1</span></div><div class="stat">LIVES: <span id="lives">20</span></div></div>
  <div id="title">TOWER DEFENSE</div>
  <div id="frame"><canvas id="game"></canvas><div id="hint">Choose a tower, then tap a glowing pad</div><div id="panel"><div><h1 id="pTitle">POCKET TD</h1><p id="pText">Build towers on glowing pads. Stop the monsters before they reach the gate.</p><button id="start">START</button></div></div><div id="toast">Need coins</div></div>
  <div id="controls"><div class="row towers"><button class="tower active" data-type="bolt">BOLT<br>$40</button><button class="tower" data-type="frost">FROST<br>$65</button><button class="tower" data-type="blast">BLAST<br>$90</button></div><div class="row bottom"><button class="small" id="next">NEXT WAVE</button><button class="small" id="restart">RESTART</button></div></div>
</div>
<script>
const cvs=document.getElementById('game'),ctx=cvs.getContext('2d');
const ui={coins:document.getElementById('coins'),wave:document.getElementById('wave'),lives:document.getElementById('lives'),panel:document.getElementById('panel'),pTitle:document.getElementById('pTitle'),pText:document.getElementById('pText'),start:document.getElementById('start'),next:document.getElementById('next'),toast:document.getElementById('toast')};
let W=360,H=560,DPR=1,selected='bolt',running=false,over=false,coins=120,lives=20,wave=1,waveOn=false,spawnLeft=0,spawnTime=0,last=0,enemies=[],towers=[],shots=[],texts=[];
const data={bolt:{cost:40,range:118,rate:.52,dmg:18,color:'#38bdf8'},frost:{cost:65,range:105,rate:.85,dmg:9,color:'#a78bfa',slow:1.6},blast:{cost:90,range:92,rate:1.2,dmg:42,color:'#fb7185',splash:45}};
const path=[[.02,.19],[.30,.19],[.30,.43],[.68,.43],[.68,.68],[.38,.68],[.38,.86],[.98,.86]];
const pads=[[.17,.34],[.47,.27],[.79,.30],[.16,.56],[.52,.56],[.84,.57],[.20,.78],[.60,.79],[.82,.73]];
function P(a){return{x:a[0]*W,y:a[1]*H}}function resize(){const r=cvs.getBoundingClientRect();DPR=window.devicePixelRatio||1;W=Math.floor(r.width);H=Math.floor(r.height);cvs.width=W*DPR;cvs.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);draw()}function toast(t){ui.toast.textContent=t;ui.toast.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>ui.toast.classList.remove('show'),900)}function uiUpdate(){ui.coins.textContent=Math.floor(coins);ui.lives.textContent=lives;ui.wave.textContent=wave}function reset(){coins=120;lives=20;wave=1;waveOn=false;spawnLeft=0;spawnTime=0;enemies=[];towers=[];shots=[];texts=[];running=false;over=false;ui.next.textContent='NEXT WAVE';uiUpdate();draw()}function startGame(){reset();running=true;ui.panel.classList.add('hide');startWave();last=performance.now();requestAnimationFrame(loop)}function startWave(){if(!running||over||waveOn)return;waveOn=true;spawnLeft=7+wave*3;spawnTime=0;ui.next.textContent='WAVE ACTIVE';toast('Wave '+wave)}function spawn(){let hp=46+wave*12;let p=P(path[0]);enemies.push({x:p.x,y:p.y,seg:0,t:0,hp,max:hp,spd:45+wave*3,slow:0,reward:10+Math.floor(wave/2),r:12+Math.min(5,wave*.4)})}function updateSpawn(dt){if(!waveOn||spawnLeft<=0)return;spawnTime-=dt;if(spawnTime<=0){spawn();spawnLeft--;spawnTime=Math.max(.38,1.02-wave*.025)}}function updateEnemies(dt){for(let i=enemies.length-1;i>=0;i--){let e=enemies[i];if(e.hp<=0){coins+=e.reward;texts.push({x:e.x,y:e.y,txt:'+$'+e.reward,life:.75});enemies.splice(i,1);continue}if(e.seg>=path.length-1){lives--;enemies.splice(i,1);if(lives<=0)endGame();continue}if(e.slow>0)e.slow-=dt;let move=e.spd*(e.slow>0?.55:1)*dt;while(move>0&&e.seg<path.length-1){let a=P(path[e.seg]),b=P(path[e.seg+1]),len=Math.hypot(b.x-a.x,b.y-a.y),left=len-e.t*len;if(move<left){e.t+=move/len;move=0}else{move-=left;e.seg++;e.t=0}}if(e.seg<path.length-1){let a=P(path[e.seg]),b=P(path[e.seg+1]);e.x=a.x+(b.x-a.x)*e.t;e.y=a.y+(b.y-a.y)*e.t}}if(waveOn&&spawnLeft<=0&&enemies.length===0){waveOn=false;coins+=35+wave*4;texts.push({x:W/2,y:H*.17,txt:'WAVE CLEAR',life:1});wave++;ui.next.textContent='NEXT WAVE'}}function updateTowers(dt){for(const t of towers){t.cool-=dt;if(t.cool>0)continue;let d=data[t.type],target=null,best=-1,range=d.range*(1+(t.lv-1)*.13);for(const e of enemies){let dis=Math.hypot(e.x-t.x,e.y-t.y),prog=e.seg+e.t;if(dis<=range&&prog>best){best=prog;target=e}}if(!target)continue;t.cool=d.rate*Math.max(.72,1-(t.lv-1)*.09);shots.push({x:t.x,y:t.y,target,type:t.type,dmg:d.dmg*(1+(t.lv-1)*.35),color:d.color,slow:d.slow||0,splash:d.splash||0,spd:420})}}function updateShots(dt){for(let i=shots.length-1;i>=0;i--){let s=shots[i];if(!enemies.includes(s.target)||s.target.hp<=0){shots.splice(i,1);continue}let dx=s.target.x-s.x,dy=s.target.y-s.y,len=Math.hypot(dx,dy);if(len<12){hit(s);shots.splice(i,1);continue}s.x+=dx/len*s.spd*dt;s.y+=dy/len*s.spd*dt}}function hit(s){if(s.splash){for(const e of enemies)if(Math.hypot(e.x-s.target.x,e.y-s.target.y)<=s.splash)e.hp-=s.dmg;texts.push({x:s.target.x,y:s.target.y,txt:'BOOM',life:.45})}else s.target.hp-=s.dmg;if(s.slow){s.target.slow=1.5;texts.push({x:s.target.x,y:s.target.y,txt:'SLOW',life:.45})}}function updateTexts(dt){for(let i=texts.length-1;i>=0;i--){texts[i].life-=dt;texts[i].y-=22*dt;if(texts[i].life<=0)texts.splice(i,1)}}function endGame(){over=true;running=false;waveOn=false;ui.pTitle.textContent='GAME OVER';ui.pText.textContent='You reached wave '+wave+'. Tap PLAY AGAIN to restart.';ui.start.textContent='PLAY AGAIN';ui.panel.classList.remove('hide')}function loop(now){if(!running||over)return;let dt=Math.min(.033,(now-last)/1000);last=now;updateSpawn(dt);updateEnemies(dt);updateTowers(dt);updateShots(dt);updateTexts(dt);uiUpdate();draw();requestAnimationFrame(loop)}function draw(){if(!ctx)return;ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#17253a');g.addColorStop(1,'#0b1220');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(255,255,255,.035)';ctx.lineWidth=1;for(let x=0;x<W;x+=28){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=28){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}drawPath();drawPads();drawTowers();drawEnemies();drawShots();drawTexts()}function drawPath(){ctx.lineCap='round';ctx.lineJoin='round';for(const st of [[34,'rgba(255,207,102,.25)'],[22,'rgba(245,158,11,.72)']]){ctx.beginPath();path.forEach((p,i)=>{let q=P(p);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});ctx.lineWidth=st[0];ctx.strokeStyle=st[1];ctx.stroke()}ctx.strokeStyle='rgba(255,255,255,.18)';ctx.setLineDash([7,10]);ctx.lineWidth=2;ctx.beginPath();path.forEach((p,i)=>{let q=P(p);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});ctx.stroke();ctx.setLineDash([]);gate(P(path[0]),'IN');gate(P(path[path.length-1]),'GATE')}function gate(p,t){ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.roundRect?ctx.roundRect(p.x-28,p.y-18,56,36,12):ctx.rect(p.x-28,p.y-18,56,36);ctx.fill();ctx.fillStyle='rgba(255,255,255,.86)';ctx.font='900 11px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t,p.x,p.y)}function drawPads(){pads.forEach((pa,i)=>{let p=P(pa),built=towers.find(t=>t.pad===i);ctx.beginPath();ctx.arc(p.x,p.y,18,0,Math.PI*2);ctx.fillStyle=built?'rgba(15,23,42,.62)':'rgba(255,255,255,.11)';ctx.fill();ctx.strokeStyle=built?'rgba(255,255,255,.12)':'rgba(250,204,21,.66)';ctx.lineWidth=built?2:3;ctx.stroke();if(!built){ctx.fillStyle='rgba(250,204,21,.72)';ctx.font='900 19px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('+',p.x,p.y+1)}})}function drawTowers(){for(const t of towers){let d=data[t.type];ctx.beginPath();ctx.arc(t.x,t.y,d.range*(1+(t.lv-1)*.13),0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.025)';ctx.fill();ctx.beginPath();ctx.arc(t.x,t.y,20,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,.36)';ctx.fill();ctx.beginPath();ctx.arc(t.x,t.y,13+t.lv*1.2,0,Math.PI*2);ctx.fillStyle=d.color;ctx.fill();ctx.fillStyle='#111827';ctx.font='900 11px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t.lv,t.x,t.y)}}function drawEnemies(){for(const e of enemies){let hp=Math.max(0,e.hp/e.max);ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fillStyle=e.slow>0?'#93c5fd':'#ef4444';ctx.fill();ctx.fillStyle='#111827';ctx.beginPath();ctx.arc(e.x-e.r*.35,e.y-e.r*.22,e.r*.16,0,Math.PI*2);ctx.arc(e.x+e.r*.35,e.y-e.r*.22,e.r*.16,0,Math.PI*2);ctx.fill();let bw=e.r*2.1;ctx.fillStyle='rgba(0,0,0,.42)';ctx.fillRect(e.x-bw/2,e.y-e.r-12,bw,4);ctx.fillStyle='#22c55e';ctx.fillRect(e.x-bw/2,e.y-e.r-12,bw*hp,4)}}function drawShots(){for(const s of shots){ctx.beginPath();ctx.arc(s.x,s.y,s.type==='blast'?6:4,0,Math.PI*2);ctx.fillStyle=s.color;ctx.fill()}}function drawTexts(){for(const f of texts){ctx.globalAlpha=Math.max(0,Math.min(1,f.life));ctx.fillStyle='#fff';ctx.font='900 15px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(f.txt,f.x,f.y);ctx.globalAlpha=1}}function pointer(e){let r=cvs.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:(p.clientX-r.left)*W/r.width,y:(p.clientY-r.top)*H/r.height}}function tap(e){e.preventDefault();if(!running||over)return;let m=pointer(e),id=-1,best=999;pads.forEach((pa,i)=>{let p=P(pa),d=Math.hypot(m.x-p.x,m.y-p.y);if(d<best){best=d;id=i}});if(id<0||best>36)return;let old=towers.find(t=>t.pad===id);if(old){let cost=45+old.lv*30;if(old.lv>=3)return toast('Max level');if(coins<cost)return toast('Need $'+cost);coins-=cost;old.lv++;texts.push({x:old.x,y:old.y-20,txt:'UPGRADE',life:.75});return}let d=data[selected];if(coins<d.cost)return toast('Need $'+d.cost);let p=P(pads[id]);coins-=d.cost;towers.push({pad:id,type:selected,x:p.x,y:p.y,lv:1,cool:0});texts.push({x:p.x,y:p.y-24,txt:selected.toUpperCase(),life:.65})}
document.querySelectorAll('.tower').forEach(b=>b.onclick=()=>{selected=b.dataset.type;document.querySelectorAll('.tower').forEach(x=>x.classList.remove('active'));b.classList.add('active')});ui.start.onclick=startGame;document.getElementById('restart').onclick=()=>{ui.pTitle.textContent='POCKET TD';ui.pText.textContent='Build towers on glowing pads. Stop the monsters before they reach the gate.';ui.start.textContent='START';startGame()};ui.next.onclick=()=>{if(!running)return;if(waveOn)toast('Wave is active');else startWave()};cvs.addEventListener('click',tap);cvs.addEventListener('touchstart',tap,{passive:false});document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});window.addEventListener('resize',resize);reset();resize();
</script>
</body>
</html>
