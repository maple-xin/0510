<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Root Rush Wave</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif;touch-action:none}body{display:flex;align-items:center;justify-content:center}#app{width:100vw;height:100vh;max-width:520px;background:radial-gradient(circle at 50% 18%,#49321f,#090705 72%);position:relative;overflow:hidden}canvas{width:100%;height:100%;display:block}#hud{position:absolute;top:18px;left:18px;right:18px;z-index:4;pointer-events:none}.row{display:flex;justify-content:space-between;gap:10px}.badge{height:42px;padding:0 18px;border-radius:999px;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.16);display:flex;align-items:center;font-weight:900;letter-spacing:2px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);white-space:nowrap}.dot{width:11px;height:11px;border-radius:50%;background:#4ade80;box-shadow:0 0 14px #4ade80;margin-right:10px}.depth{text-align:right;font-weight:1000;text-shadow:0 5px 18px rgba(0,0,0,.4)}.depth small{display:block;font-size:13px;letter-spacing:4px;opacity:.75}.depth span{font-size:44px;line-height:1}#barWrap{margin-top:18px;height:16px;border-radius:999px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.18);overflow:hidden}#bar{height:100%;width:100%;background:linear-gradient(90deg,#54e8ff,#6dff8d,#fff06b);border-radius:999px}#bestLine{position:absolute;left:20px;top:118px;font-size:13px;font-weight:900;letter-spacing:2px;z-index:3;color:rgba(255,255,255,.8);pointer-events:none}#controls{position:absolute;left:18px;right:18px;bottom:60px;display:flex;gap:12px;z-index:5}.btn{flex:1;height:58px;border-radius:20px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.38);color:white;font-size:16px;font-weight:1000;letter-spacing:1px;box-shadow:0 12px 30px rgba(0,0,0,.35)}.btn:active,#start:active{transform:scale(.96)}#overlay{position:absolute;inset:0;z-index:10;background:rgba(0,0,0,.45);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:72px 20px 20px;overflow:auto}#overlay.hidden{display:none}.panel{width:100%;border-radius:32px;background:rgba(24,20,16,.9);border:1px solid rgba(255,255,255,.16);box-shadow:0 24px 80px rgba(0,0,0,.55);padding:34px 22px;text-align:center}h1{margin:0;font-size:50px;line-height:.92;font-weight:1000;letter-spacing:1px}.sub{margin:18px auto 24px;max-width:390px;color:rgba(255,255,255,.78);font-size:17px;line-height:1.35;font-weight:800}.cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:16px 0 26px}.card{border-radius:20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:16px 8px}.card b{display:block;font-size:17px;letter-spacing:2px}.card span{display:block;margin-top:8px;color:rgba(255,255,255,.68);font-size:12px;font-weight:900}#start{width:100%;height:66px;border:0;border-radius:999px;background:linear-gradient(135deg,#5efce8,#8cff8c,#fff06b);color:#09110f;font-size:20px;font-weight:1000;letter-spacing:2px}.rank{margin-top:24px;border-radius:24px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.12);padding:20px;text-align:left}.rank h2{margin:0 0 14px;font-size:20px;letter-spacing:3px}.rank p{margin:8px 0;color:rgba(255,255,255,.72);font-weight:800}#toast{position:absolute;left:50%;top:92px;transform:translateX(-50%);z-index:8;padding:8px 16px;border-radius:999px;background:rgba(0,0,0,.62);border:1px solid rgba(255,255,255,.16);font-size:14px;font-weight:900;opacity:0;transition:.18s;white-space:nowrap}#toast.show{opacity:1}@media(max-height:720px){#overlay{padding-top:42px}.panel{padding:24px 18px}h1{font-size:40px}.sub{font-size:14px;margin:14px auto}.cards{margin:12px 0 18px}.card{padding:12px 6px}#start{height:56px}.rank{display:none}#controls{bottom:38px}.btn{height:50px}#bestLine{top:104px}}
</style>
</head>
<body>
<div id="app">
<canvas id="game"></canvas>
<div id="hud"><div class="row"><div class="badge"><i class="dot"></i><span>WATER HUNT</span></div><div class="depth"><small>DEPTH</small><span id="depth">0m</span></div></div><div id="barWrap"><div id="bar"></div></div></div>
<div id="bestLine">BEST ROOT: <span id="best">0m</span></div>
<div id="controls"><button class="btn" id="left">◀ LEFT</button><button class="btn" id="right">RIGHT ▶</button></div>
<div id="toast">+ WATER</div>
<div id="overlay"><div class="panel"><h1>ROOT<br>RUSH</h1><div class="sub">The root grows downward in a sine-wave path. Guide its wave, collect glowing water, and dodge rocks.</div><div class="cards"><div class="card"><b>WAVE</b><span>Auto curve</span></div><div class="card"><b>WATER</b><span>Heal</span></div><div class="card"><b>ROCKS</b><span>Damage</span></div></div><button id="start">START DIGGING</button><div class="rank"><h2>RANKING HOUSE</h2><p>1. RootKing · 428m</p><p>2. DeepBean · 361m</p><p>3. You · ready?</p></div></div></div>
</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),depthEl=document.getElementById('depth'),bar=document.getElementById('bar'),overlay=document.getElementById('overlay'),startBtn=document.getElementById('start'),toast=document.getElementById('toast'),bestEl=document.getElementById('best');
let W=360,H=640,dpr=1,running=false,gameOver=false,last=0,depth=0,energy=100,best=Number(localStorage.rootRushWaveBest||0),headX=180,targetOffset=0,offset=0,root=[],rocks=[],waters=[],dust=[],marks=[],spawnR=0,spawnW=0,scroll=0,left=false,right=false,headY=0;
bestEl.textContent=Math.floor(best)+'m';
function resize(){const r=canvas.getBoundingClientRect();dpr=window.devicePixelRatio||1;W=r.width;H=r.height;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);headY=H*.34;if(!running)headX=W/2;draw()}
function reset(){running=false;gameOver=false;depth=0;energy=100;scroll=0;targetOffset=0;offset=0;headX=W/2;root=[];rocks=[];waters=[];dust=[];marks=[];spawnR=.25;spawnW=1.2;headY=H*.34;for(let i=0;i<18;i++)marks.push({world:i*80,label:i*10});updateHud();draw()}
function begin(){reset();overlay.classList.add('hidden');running=true;last=performance.now();requestAnimationFrame(loop)}
function updateHud(){depthEl.textContent=Math.floor(depth)+'m';bar.style.width=Math.max(0,energy)+'%'}
function rand(a,b){return a+Math.random()*(b-a)}
function pop(text){toast.textContent=text;toast.classList.add('show');clearTimeout(pop.t);pop.t=setTimeout(()=>toast.classList.remove('show'),650)}
function addDust(x,y,c,n){for(let i=0;i<n;i++)dust.push({x,y,vx:rand(-42,42),vy:rand(-58,20),life:rand(.35,.8),r:rand(2,5),c})}
function spawnRock(){const r=rand(26,58);rocks.push({x:rand(r+20,W-r-20),world:depth*20+H+80,r,rot:rand(0,7),vr:rand(-1,1)})}
function spawnWater(){const r=rand(20,32);waters.push({x:rand(50,W-50),world:depth*20+H+80,r,pulse:rand(0,6)})}
function worldToScreen(wy){const headWorld=depth*20;return headY+(wy-headWorld)}
function loop(now){if(!running||gameOver)return;const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}
function update(dt){depth+=dt*8.5;scroll+=dt*92;energy-=dt*2;if(left)targetOffset-=290*dt;if(right)targetOffset+=290*dt;targetOffset=Math.max(-W*.36,Math.min(W*.36,targetOffset));offset+=(targetOffset-offset)*8*dt;const wave=Math.sin(depth*.56)*W*.22+Math.sin(depth*1.28)*W*.055;headX=W/2+offset+wave;headX=Math.max(36,Math.min(W-36,headX));root.push({x:headX,world:depth*20});if(root.length>170)root.shift();spawnR-=dt;spawnW-=dt;if(spawnR<=0){spawnRock();spawnR=rand(.46,.88)}if(spawnW<=0){spawnWater();spawnW=rand(2.15,3.55)}for(const r of rocks)r.rot+=r.vr*dt;for(const w of waters)w.pulse+=dt*4;for(let i=rocks.length-1;i>=0;i--){const r=rocks[i],sy=worldToScreen(r.world);if(sy<-100){rocks.splice(i,1);continue}const d=Math.hypot(r.x-headX,sy-headY);if(d<r.r*.72+18){rocks.splice(i,1);energy-=24;addDust(headX,headY,'#f87171',26);pop('ROCK HIT');if(energy<=0){finish();return}}}for(let i=waters.length-1;i>=0;i--){const w=waters[i],sy=worldToScreen(w.world);if(sy<-100){waters.splice(i,1);continue}const d=Math.hypot(w.x-headX,sy-headY);if(d<w.r+27){waters.splice(i,1);energy=Math.min(100,energy+25);depth+=7;addDust(w.x,sy,'#5ee7ff',30);pop('+ WATER')}}for(const p of dust){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=90*dt}dust=dust.filter(p=>p.life>0);if(depth>best){best=depth;localStorage.rootRushWaveBest=Math.floor(best);bestEl.textContent=Math.floor(best)+'m'}if(energy<=0){finish();return}updateHud()}
function finish(){gameOver=true;running=false;overlay.classList.remove('hidden');document.querySelector('h1').innerHTML='ROOT<br>STOPPED';document.querySelector('.sub').textContent='Final depth: '+Math.floor(depth)+'m. This version grows in a downward sine-wave path. Try again and ride the curve.';startBtn.textContent='DIG AGAIN'}
function bg(){const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#36301e');g.addColorStop(.52,'#1b1710');g.addColorStop(1,'#070605');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(255,255,255,.035)';for(let i=0;i<85;i++){const px=(i*73+scroll*.2)%W,py=(i*137-scroll*.55)%(H+100)-50;ctx.beginPath();ctx.ellipse(px,py,rand(2,9),rand(1,4),0,0,Math.PI*2);ctx.fill()}ctx.strokeStyle='rgba(255,255,255,.17)';ctx.lineWidth=1;const headWorld=depth*20;for(const m of marks){const sy=worldToScreen(m.world);if(sy>-40&&sy<H+40){ctx.beginPath();ctx.moveTo(18,sy);ctx.lineTo(72,sy);ctx.stroke();ctx.fillStyle='rgba(255,255,255,.28)';ctx.font='13px Arial';ctx.fillText(m.label+'m',18,sy-9)}if(m.world<headWorld-H*.5){m.world+=1440;m.label+=180}}}
function rock(r){const sy=worldToScreen(r.world);ctx.save();ctx.translate(r.x,sy);ctx.rotate(r.rot);ctx.fillStyle='#4b4940';ctx.strokeStyle='#1c1a16';ctx.lineWidth=5;ctx.beginPath();const n=7;for(let i=0;i<n;i++){const a=i/n*Math.PI*2,rr=r.r*(.74+Math.sin(i*2.1)*.13);if(i===0)ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);else ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='rgba(255,255,255,.12)';ctx.beginPath();ctx.ellipse(-r.r*.2,-r.r*.12,r.r*.18,r.r*.34,-.5,0,Math.PI*2);ctx.fill();ctx.restore()}
function water(w){const sy=worldToScreen(w.world),glow=ctx.createRadialGradient(w.x-8,sy-8,2,w.x,sy,w.r*2);glow.addColorStop(0,'#e5ffff');glow.addColorStop(.35,'#5ee7ff');glow.addColorStop(1,'rgba(30,144,255,0)');ctx.fillStyle=glow;ctx.beginPath();ctx.ellipse(w.x,sy,w.r*1.9,w.r*.95,.45,0,Math.PI*2);ctx.fill()}
function drawRoot(){if(root.length<2){root.push({x:headX,world:depth*20-180});root.push({x:headX,world:depth*20})}const visible=root.filter(p=>{const y=worldToScreen(p.world);return y>-70&&y<H+40});if(visible.length<2)return;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#7a4923';ctx.lineWidth=16;ctx.beginPath();ctx.moveTo(visible[0].x,worldToScreen(visible[0].world));for(let i=1;i<visible.length;i++){const p=visible[i];ctx.lineTo(p.x,worldToScreen(p.world))}ctx.stroke();ctx.strokeStyle='#bd7434';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(visible[0].x,worldToScreen(visible[0].world));for(let i=1;i<visible.length;i++){const p=visible[i];ctx.lineTo(p.x,worldToScreen(p.world))}ctx.stroke();ctx.strokeStyle='rgba(225,180,110,.35)';ctx.lineWidth=2;for(let i=0;i<visible.length;i+=12){const p=visible[i],sy=worldToScreen(p.world),side=i%24===0?1:-1;ctx.beginPath();ctx.moveTo(p.x,sy);ctx.quadraticCurveTo(p.x+side*28,sy+8,p.x+side*48,sy+28);ctx.stroke()}const glow=ctx.createRadialGradient(headX,headY,4,headX,headY,62);glow.addColorStop(0,'rgba(136,255,130,.42)');glow.addColorStop(1,'rgba(136,255,130,0)');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(headX,headY,62,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e1a94d';ctx.beginPath();ctx.arc(headX,headY,24,0,Math.PI*2);ctx.fill();ctx.fillStyle='#5a2d17';ctx.beginPath();ctx.ellipse(headX-8,headY+3,4.5,8.5,0,0,Math.PI*2);ctx.ellipse(headX+8,headY+3,4.5,8.5,0,0,Math.PI*2);ctx.fill()}
function draw(){if(!ctx)return;bg();for(const w of waters)water(w);for(const r of rocks)rock(r);drawRoot();for(const p of dust){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}}
function setPointer(clientX){const rect=canvas.getBoundingClientRect();targetOffset=clientX-rect.left-W/2}
canvas.addEventListener('pointerdown',e=>setPointer(e.clientX));canvas.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')setPointer(e.clientX)});canvas.addEventListener('touchmove',e=>{setPointer(e.touches[0].clientX);e.preventDefault()},{passive:false});
const leftBtn=document.getElementById('left'),rightBtn=document.getElementById('right');
leftBtn.addEventListener('touchstart',e=>{e.preventDefault();left=true},{passive:false});leftBtn.addEventListener('touchend',e=>{e.preventDefault();left=false},{passive:false});rightBtn.addEventListener('touchstart',e=>{e.preventDefault();right=true},{passive:false});rightBtn.addEventListener('touchend',e=>{e.preventDefault();right=false},{passive:false});leftBtn.addEventListener('mousedown',()=>left=true);rightBtn.addEventListener('mousedown',()=>right=true);window.addEventListener('mouseup',()=>{left=false;right=false});window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')left=true;if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')right=true});window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')left=false;if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')right=false});startBtn.addEventListener('click',begin);window.addEventListener('resize',resize);document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});reset();resize();
</script>
</body>
</html>
