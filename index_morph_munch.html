<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Morph Munch</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#121827;color:#fff;font-family:Arial,Helvetica,sans-serif;touch-action:none}body{display:flex;align-items:center;justify-content:center}#app{width:100vw;height:100vh;max-width:520px;background:radial-gradient(circle at 50% 12%,rgba(255,150,210,.35),transparent 34%),linear-gradient(#1b2540,#111827);padding:14px 12px;display:flex;flex-direction:column;gap:8px;position:relative}.top{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.pill{height:38px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25)}h1{margin:2px 0;text-align:center;font-size:25px;letter-spacing:2px;text-shadow:0 8px 24px rgba(0,0,0,.35)}#frame{flex:1;min-height:0;padding:8px;border-radius:24px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);position:relative;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.42)}canvas{width:100%;height:100%;display:block;border-radius:18px;background:#19233b;box-shadow:inset 0 0 0 2px rgba(255,255,255,.05)}#badge{position:absolute;top:16px;left:50%;transform:translateX(-50%);padding:7px 14px;border-radius:99px;background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.12);font-size:12px;font-weight:900;z-index:3;white-space:nowrap;pointer-events:none}#overlay{position:absolute;inset:8px;border-radius:18px;background:rgba(5,10,18,.85);backdrop-filter:blur(9px);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:10}#overlay.hide{display:none}#ot{font-size:36px;font-weight:1000;margin:0 0 12px;line-height:1.03}#op{font-size:15px;line-height:1.5;color:rgba(255,255,255,.82);max-width:330px;margin:0 auto 22px}.main{border:0;border-radius:99px;height:54px;min-width:172px;padding:0 28px;font-size:18px;font-weight:1000;background:linear-gradient(135deg,#f9a8d4,#fb7185 45%,#facc15);color:#151515;box-shadow:0 12px 34px rgba(251,113,133,.35)}#controls{display:grid;grid-template-columns:1fr 1fr 1.1fr 1.1fr;gap:8px}.btn{height:58px;border-radius:18px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.1);color:#fff;font-weight:1000;font-size:14px;box-shadow:0 8px 26px rgba(0,0,0,.27)}#munch{background:linear-gradient(135deg,#f9a8d4,#fb7185);color:#171717}#act{background:linear-gradient(135deg,#93c5fd,#38bdf8);color:#111827}.btn:active,.main:active{transform:scale(.95)}#toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:20;padding:8px 14px;border-radius:99px;background:rgba(0,0,0,.62);border:1px solid rgba(255,255,255,.14);font-weight:900;font-size:13px;opacity:0;transition:.18s;white-space:nowrap}#toast.show{opacity:1}@media(max-height:720px){#app{padding:10px 12px}.pill{height:34px;font-size:12px}h1{font-size:20px}.btn{height:48px;border-radius:14px;font-size:12px}}
</style>
</head>
<body>
<div id="app">
 <div class="top"><div class="pill">SCORE: <span id="score">0</span></div><div class="pill">TIME: <span id="time">60</span></div><div class="pill">HP: <span id="hp">3</span></div></div>
 <h1>MORPH MUNCH</h1>
 <div id="frame"><canvas id="game"></canvas><div id="badge">NORMAL FORM</div><div id="overlay"><div><div id="ot">MORPH MUNCH</div><p id="op">Swallow big objects and transform. Car dashes, cone smashes, ring blows, box shields.</p><button class="main" id="start">START</button></div></div><div id="toast">MUNCH!</div></div>
 <div id="controls"><button class="btn" id="left">◀ LEFT</button><button class="btn" id="right">RIGHT ▶</button><button class="btn" id="munch">MUNCH</button><button class="btn" id="act">ACTION</button></div>
</div>
<script>
const cvs=document.getElementById('game'),ctx=cvs.getContext('2d'),scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),hpEl=document.getElementById('hp'),badge=document.getElementById('badge'),ov=document.getElementById('overlay'),ot=document.getElementById('ot'),op=document.getElementById('op'),start=document.getElementById('start'),toast=document.getElementById('toast');
let W=360,H=560,dpr=1,ground=430,run=false,over=false,last=0,scroll=0,score=0,hp=3,time=60,spawn=0,item=0,inv=0,keys={l:false,r:false};
let p,objs=[],obs=[],parts=[],clouds=[];
const form={normal:['NORMAL FORM','#f9a8d4',0],car:['CAR FORM','#fb923c',8],cone:['CONE FORM','#facc15',8],ring:['RING FORM','#38bdf8',8],box:['BOX FORM','#a78bfa',8]},types=['car','cone','ring','box'];
function resize(){const r=cvs.getBoundingClientRect();dpr=devicePixelRatio||1;W=Math.max(280,r.width|0);H=Math.max(360,r.height|0);cvs.width=W*dpr;cvs.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ground=H*.78;draw()}
function reset(){score=0;hp=3;time=60;scroll=0;spawn=.8;item=.8;inv=0;objs=[];obs=[];parts=[];clouds=[];over=false;run=false;keys.l=keys.r=false;p={x:W*.25,y:ground,vx:0,r:28,f:'normal',ft:0,cd:0,pulse:0};for(let i=0;i<5;i++)clouds.push({x:Math.random()*W,y:H*(.12+Math.random()*.24),s:24+Math.random()*34,v:4+Math.random()*8});ui();draw()}
function begin(){reset();run=true;ov.classList.add('hide');last=performance.now();requestAnimationFrame(loop)}
function ui(){scoreEl.textContent=score|0;hpEl.textContent=hp;timeEl.textContent=Math.max(0,Math.ceil(time));badge.textContent=form[p.f][0]+(p.ft>0?' '+Math.ceil(p.ft)+'s':'')}
function say(t){toast.textContent=t;toast.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>toast.classList.remove('show'),800)}
function rnd(a,b){return a+Math.random()*(b-a)}
function spawnObj(){let t=types[Math.random()*types.length|0];objs.push({t,x:W+54,y:ground,r:t=='car'?30:t=='box'?27:24,w:Math.random()*9})}
function spawnOb(){let a=['rock','wall','fly'],t=a[Math.random()*a.length|0];obs.push({t,x:W+55,y:t=='fly'?ground-86:ground,w:t=='wall'?30:t=='fly'?35:38,h:t=='wall'?72:t=='fly'?28:35,dead:false})}
function burst(x,y,c,n){for(let i=0;i<n;i++)parts.push({x,y,vx:rnd(-90,90),vy:rnd(-130,50),life:rnd(.35,.75),c,r:rnd(3,7)})}
function morph(t){p.f=t;p.ft=form[t][2];p.pulse=.45;score+=25;say(form[t][0]);burst(p.x,p.y-10,form[t][1],18)}
function munch(){if(!run||over)return;let tar=null,b=999;for(const o of objs){let d=Math.hypot(o.x-p.x,o.y-p.y);if(d<b){b=d;tar=o}}if(tar&&b<82){objs=objs.filter(o=>o!==tar);morph(tar.t)}else{p.pulse=.24;say('Move closer!')}}
function action(){if(!run||over||p.cd>0)return;p.cd=.45;if(p.f=='normal'){p.pulse=.2;say('Need object!');return}if(p.f=='car'){p.vx=360;inv=Math.max(inv,.45);say('DASH!');burst(p.x-20,p.y+10,'#fb923c',12)}if(p.f=='cone'){say('SMASH!');burst(p.x+34,p.y,'#facc15',18);for(const o of obs)if(Math.abs(o.x-p.x)<125&&o.t!='fly'){o.dead=true;score+=30}}if(p.f=='ring'){say('WIND!');burst(p.x+40,p.y-20,'#38bdf8',22);for(const o of obs)if(o.x>p.x&&o.x<p.x+185){o.dead=true;score+=25}}if(p.f=='box'){inv=Math.max(inv,1.6);say('SHIELD!');burst(p.x,p.y,'#a78bfa',16)}}
function update(dt){scroll+=95*dt;time-=dt;if(time<=0){finish();return}if(inv>0)inv-=dt;if(p.cd>0)p.cd-=dt;if(p.pulse>0)p.pulse-=dt;let m=(keys.r?1:0)-(keys.l?1:0);p.vx+=m*740*dt;p.vx*=Math.pow(.0009,dt);p.x+=p.vx*dt;p.x=Math.max(48,Math.min(W-48,p.x));if(p.f!='normal'){p.ft-=dt;if(p.ft<=0){p.f='normal';p.ft=0;say('Normal again')}}for(const c of clouds){c.x-=c.v*dt;if(c.x<-90){c.x=W+90;c.y=H*(.12+Math.random()*.24)}}item-=dt;spawn-=dt;if(item<=0){spawnObj();item=rnd(3.1,5.0)}if(spawn<=0){spawnOb();spawn=rnd(1.35,2.35)}for(const o of objs){o.x-=115*dt;o.w+=dt*4}for(const o of obs){o.x-=135*dt;let hit=Math.abs(p.x-o.x)<p.r+o.w*.48&&Math.abs(p.y-o.y)<p.r+o.h*.45;if(hit&&!o.dead){let ok=inv>0||(p.f=='car'&&o.t!='fly')||(p.f=='cone'&&o.t=='wall')||(p.f=='ring'&&o.t=='fly')||p.f=='box';if(ok){o.dead=true;score+=18;burst(o.x,o.y,'#fff',12)}else{o.dead=true;hp--;inv=1;burst(p.x,p.y,'#fb7185',20);say('OUCH!');if(hp<=0){lose();return}}}}objs=objs.filter(o=>o.x>-80);obs=obs.filter(o=>o.x>-80&&!o.dead);for(const q of parts){q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=240*dt}parts=parts.filter(q=>q.life>0);score+=dt*3;ui()}
function lose(){over=true;run=false;ot.textContent='GAME OVER';op.textContent='Final score: '+(score|0)+'. Swallow objects faster and use the right form.';start.textContent='PLAY AGAIN';ov.classList.remove('hide')}
function finish(){over=true;run=false;score+=hp*80;ot.textContent='STAGE CLEAR';op.textContent='Final score: '+(score|0)+'. Car dashes, cone smashes, ring blows, box shields.';start.textContent='PLAY AGAIN';ov.classList.remove('hide')}
function loop(now){if(!run||over)return;let dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function sky(){ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#202a4a');g.addColorStop(.55,'#2b3358');g.addColorStop(1,'#111827');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(255,255,255,.12)';for(const c of clouds){ctx.beginPath();ctx.arc(c.x,c.y,c.s*.56,0,7);ctx.arc(c.x+c.s*.45,c.y+4,c.s*.42,0,7);ctx.arc(c.x-c.s*.45,c.y+6,c.s*.38,0,7);ctx.fill()}ctx.fillStyle='#293245';ctx.fillRect(0,ground+28,W,H-ground);ctx.fillStyle='#4ade80';ctx.fillRect(0,ground+10,W,26);ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=2;for(let x=-(scroll*.7%52);x<W+52;x+=52){ctx.beginPath();ctx.moveTo(x,ground+38);ctx.lineTo(x+28,ground+38);ctx.stroke()}}
function player(){let pulse=p.pulse>0?Math.sin(p.pulse*30)*4+8:0,blink=inv>0&&Math.floor(inv*18)%2==0;ctx.save();ctx.globalAlpha=blink?.56:1;ctx.translate(p.x,p.y);if(p.f=='car'){ctx.fillStyle='#fb923c';rr(-40,-28,80,44,18);ctx.fillStyle='#fed7aa';rr(-16,-46,38,22,12);ctx.fillStyle='#111827';ctx.beginPath();ctx.arc(-24,18,11,0,7);ctx.arc(26,18,11,0,7);ctx.fill()}else if(p.f=='cone'){ctx.fillStyle='#facc15';ctx.beginPath();ctx.moveTo(0,-58);ctx.lineTo(44,22);ctx.lineTo(-44,22);ctx.closePath();ctx.fill();ctx.fillStyle='#fb923c';ctx.fillRect(-33,-5,66,10)}else if(p.f=='ring'){ctx.strokeStyle='#38bdf8';ctx.lineWidth=18;ctx.beginPath();ctx.arc(0,-8,38,0,7);ctx.stroke();ctx.fillStyle='#e0f2fe';ctx.beginPath();ctx.arc(0,-8,13,0,7);ctx.fill()}else if(p.f=='box'){ctx.fillStyle='#a78bfa';rr(-40,-48,80,72,12);ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=3;ctx.strokeRect(-28,-36,56,48)}else{ctx.fillStyle='#f9a8d4';ctx.beginPath();ctx.arc(0,-10,32+pulse,0,7);ctx.fill();ctx.fillStyle='#111827';ctx.beginPath();ctx.arc(-12,-20,4,0,7);ctx.arc(12,-20,4,0,7);ctx.fill();ctx.strokeStyle='#111827';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,-10,16+pulse*.5,.15,Math.PI-.15);ctx.stroke()}ctx.restore();ctx.fillStyle='rgba(255,255,255,.22)';ctx.beginPath();ctx.ellipse(p.x,ground+30,38,8,0,0,7);ctx.fill()}
function drawObjs(){for(const o of objs){let y=o.y+Math.sin(o.w)*4;ctx.save();ctx.translate(o.x,y);if(o.t=='car'){ctx.fillStyle='#fb923c';rr(-26,-24,52,32,12);ctx.fillStyle='#111827';ctx.beginPath();ctx.arc(-15,10,7,0,7);ctx.arc(17,10,7,0,7);ctx.fill()}if(o.t=='cone'){ctx.fillStyle='#facc15';ctx.beginPath();ctx.moveTo(0,-35);ctx.lineTo(26,15);ctx.lineTo(-26,15);ctx.closePath();ctx.fill();ctx.fillStyle='#fb923c';ctx.fillRect(-18,-2,36,8)}if(o.t=='ring'){ctx.strokeStyle='#38bdf8';ctx.lineWidth=9;ctx.beginPath();ctx.arc(0,-10,24,0,7);ctx.stroke()}if(o.t=='box'){ctx.fillStyle='#a78bfa';rr(-24,-32,48,48,8);ctx.strokeStyle='rgba(255,255,255,.36)';ctx.strokeRect(-16,-24,32,32)}ctx.restore()}}
function drawObs(){for(const o of obs){ctx.save();ctx.translate(o.x,o.y);if(o.t=='rock'){ctx.fillStyle='#64748b';ctx.beginPath();ctx.arc(0,2,22,0,7);ctx.fill();ctx.fillStyle='rgba(255,255,255,.18)';ctx.beginPath();ctx.arc(-8,-6,5,0,7);ctx.fill()}if(o.t=='wall'){ctx.fillStyle='#ef4444';rr(-16,-56,32,70,6);ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(-12,-36,24,6);ctx.fillRect(-12,-14,24,6)}if(o.t=='fly'){ctx.fillStyle='#22c55e';ctx.beginPath();ctx.arc(0,0,17,0,7);ctx.fill();ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.ellipse(-17,-10,13,7,-.4,0,7);ctx.ellipse(17,-10,13,7,.4,0,7);ctx.fill()}ctx.restore()}}
function drawParts(){for(const q of parts){ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,7);ctx.fill();ctx.globalAlpha=1}}
function draw(){if(!ctx)return;sky();drawObjs();drawObs();player();drawParts()}
start.onclick=begin;document.getElementById('munch').onclick=munch;document.getElementById('act').onclick=action;
function hold(id,k){let b=document.getElementById(id);b.addEventListener('touchstart',e=>{e.preventDefault();keys[k]=true},{passive:false});b.addEventListener('touchend',e=>{e.preventDefault();keys[k]=false},{passive:false});b.onmousedown=()=>keys[k]=true;b.onmouseup=()=>keys[k]=false;b.onmouseleave=()=>keys[k]=false}hold('left','l');hold('right','r');
window.onkeydown=e=>{if(e.key=='ArrowLeft'||e.key=='a')keys.l=true;if(e.key=='ArrowRight'||e.key=='d')keys.r=true;if(e.key==' '||e.key=='ArrowUp')action();if(e.key=='m')munch()};window.onkeyup=e=>{if(e.key=='ArrowLeft'||e.key=='a')keys.l=false;if(e.key=='ArrowRight'||e.key=='d')keys.r=false};
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});window.addEventListener('resize',resize);reset();resize();
</script>
</body>
</html>
