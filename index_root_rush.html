<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Root Rush</title><style>*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif;touch-action:none}body{display:flex;align-items:center;justify-content:center}#app{width:100vw;height:100vh;max-width:520px;background:radial-gradient(circle at 50% 20%,#49321f,#090705 72%);position:relative;overflow:hidden}canvas{width:100%;height:100%;display:block}#hud{position:absolute;top:18px;left:18px;right:18px;z-index:4;pointer-events:none}.row{display:flex;justify-content:space-between;align-items:flex-start}.badge{height:42px;padding:0 18px;border-radius:999px;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.16);display:flex;align-items:center;font-weight:900;letter-spacing:2px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}.dot{width:11px;height:11px;border-radius:50%;background:#4ade80;box-shadow:0 0 14px #4ade80;margin-right:10px}.depth{text-align:right;font-weight:1000;text-shadow:0 5px 18px rgba(0,0,0,.4)}.depth small{display:block;font-size:13px;letter-spacing:4px;opacity:.75}.depth span{font-size:44px;line-height:1}#barWrap{margin-top:18px;height:16px;border-radius:999px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.18);overflow:hidden}#bar{height:100%;width:100%;background:linear-gradient(90deg,#54e8ff,#6dff8d,#fff06b);border-radius:999px}#score{position:absolute;left:20px;bottom:24px;font-size:13px;font-weight:900;letter-spacing:2px;z-index:3;color:rgba(255,255,255,.78)}#controls{position:absolute;left:18px;right:18px;bottom:60px;display:flex;gap:12px;z-index:5}.btn{flex:1;height:58px;border-radius:20px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.38);color:white;font-size:16px;font-weight:1000;letter-spacing:1px;box-shadow:0 12px 30px rgba(0,0,0,.35)}.btn:active,#start:active{transform:scale(.96)}#overlay{position:absolute;inset:0;z-index:10;background:rgba(0,0,0,.44);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:72px 20px 20px;overflow:auto}#overlay.hidden{display:none}.panel{width:100%;border-radius:32px;background:rgba(24,20,16,.88);border:1px solid rgba(255,255,255,.16);box-shadow:0 24px 80px rgba(0,0,0,.55);padding:34px 22px;text-align:center}h1{margin:0;font-size:50px;line-height:.92;font-weight:1000;letter-spacing:1px}.sub{margin:18px auto 24px;max-width:390px;color:rgba(255,255,255,.78);font-size:17px;line-height:1.35;font-weight:800}.cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:16px 0 26px}.card{border-radius:20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:16px 8px}.card b{display:block;font-size:18px;letter-spacing:2px}.card span{display:block;margin-top:8px;color:rgba(255,255,255,.68);font-size:12px;font-weight:900}#start{width:100%;height:66px;border:0;border-radius:999px;background:linear-gradient(135deg,#5efce8,#8cff8c,#fff06b);color:#09110f;font-size:20px;font-weight:1000;letter-spacing:2px}.rank{margin-top:24px;border-radius:24px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.12);padding:20px;text-align:left}.rank h2{margin:0 0 14px;font-size:20px;letter-spacing:3px}.rank p{margin:8px 0;color:rgba(255,255,255,.72);font-weight:800}#toast{position:absolute;left:50%;top:92px;transform:translateX(-50%);z-index:8;padding:8px 16px;border-radius:999px;background:rgba(0,0,0,.62);border:1px solid rgba(255,255,255,.16);font-size:14px;font-weight:900;opacity:0;transition:.18s;white-space:nowrap}#toast.show{opacity:1}@media(max-height:720px){#overlay{padding-top:42px}.panel{padding:24px 18px}h1{font-size:40px}.sub{font-size:14px;margin:14px auto}.cards{margin:12px 0 18px}.card{padding:12px 6px}#start{height:56px}.rank{display:none}#controls{bottom:38px}.btn{height:50px}}</style></head><body><div id="app"><canvas id="game"></canvas><div id="hud"><div class="row"><div class="badge"><i class="dot"></i><span>WATER HUNT</span></div><div class="depth"><small>DEPTH</small><span id="depth">0m</span></div></div><div id="barWrap"><div id="bar"></div></div></div><div id="score">BEST ROOT: <span id="best">0m</span></div><div id="controls"><button class="btn" id="left">◀ LEFT</button><button class="btn" id="right">RIGHT ▶</button></div><div id="toast">+ WATER</div><div id="overlay"><div class="panel"><h1 id="headline">ROOT<br>RUSH</h1><div class="sub" id="sub">Dig deeper, find glowing water, dodge rocks, and grow the longest root underground.</div><div class="cards"><div class="card"><b>DRAG</b><span>Control</span></div><div class="card"><b>WATER</b><span>Heal</span></div><div class="card"><b>ROCKS</b><span>Damage</span></div></div><button id="start">START DIGGING</button><div class="rank"><h2>RANKING HOUSE</h2><p>1. RootKing · 428m</p><p>2. DeepBean · 361m</p><p>3. You · ready?</p></div></div></div></div><script>const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),depthEl=document.getElementById('depth'),bar=document.getElementById('bar'),overlay=document.getElementById('overlay'),start=document.getElementById('start'),toast=document.getElementById('toast'),bestEl=document.getElementById('best'),headline=document.getElementById('headline'),sub=document.getElementById('sub');let W=360,H=640,dpr=1,running=false,over=false,last=0,depth=0,energy=100,best=+localStorage.rootRushBest||0,x=180,targetX=180,vx=0,root=[],rocks=[],waters=[],dust=[],marks=[],spawnR=0,spawnW=1,scroll=0,left=false,right=false;bestEl.textContent=Math.floor(best)+'m';function resize(){let r=canvas.getBoundingClientRect();dpr=devicePixelRatio||1;W=r.width;H=r.height;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);targetX=x=W/2;draw()}function reset(){running=false;over=false;depth=0;energy=100;x=targetX=W/2;vx=0;root=[];rocks=[];waters=[];dust=[];marks=[];spawnR=.2;spawnW=1;scroll=0;for(let i=0;i<14;i++)marks.push({y:i*90,label:i*10});headline.innerHTML='ROOT<br>RUSH';sub.textContent='Dig deeper, find glowing water, dodge rocks, and grow the longest root underground.';start.textContent='START DIGGING';updateHud();draw()}function begin(){reset();overlay.classList.add('hidden');running=true;last=performance.now();requestAnimationFrame(loop)}function updateHud(){depthEl.textContent=Math.floor(depth)+'m';bar.style.width=Math.max(0,Math.min(100,energy))+'%'}function rand(a,b){return a+Math.random()*(b-a)}function pop(t){toast.textContent=t;toast.classList.add('show');clearTimeout(pop.t);pop.t=setTimeout(()=>toast.classList.remove('show'),650)}function spawnRock(){let s=rand(28,70);rocks.push({x:rand(s,W-s),y:H+80,r:s,rot:rand(0,7),vr:rand(-1,1)})}function spawnWater(){waters.push({x:rand(50,W-50),y:H+80,r:rand(20,34),pulse:rand(0,6)})}function addDust(px,py,c,n){for(let i=0;i<n;i++)dust.push({x:px,y:py,vx:rand(-35,35),vy:rand(-50,20),life:rand(.35,.8),r:rand(2,5),c})}function loop(now){if(!running||over)return;let dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}function update(dt){depth+=dt*8.5;scroll+=dt*92;energy-=dt*2.1;if(left)targetX-=260*dt;if(right)targetX+=260*dt;targetX=Math.max(34,Math.min(W-34,targetX));vx+=(targetX-x)*7*dt;vx*=Math.pow(.04,dt);x+=vx;let headY=H*.32;root.push({x,y:headY});if(root.length>90)root.shift();spawnR-=dt;spawnW-=dt;if(spawnR<=0){spawnRock();spawnR=rand(.45,.9)}if(spawnW<=0){spawnWater();spawnW=rand(2.2,3.7)}for(const r of rocks){r.y-=92*dt;r.rot+=r.vr*dt}for(const w of waters){w.y-=92*dt;w.pulse+=dt*4}for(const m of marks){m.y-=92*dt;if(m.y<-40){m.y+=1260;m.label+=140}}for(let i=rocks.length-1;i>=0;i--){let r=rocks[i],d=Math.hypot(r.x-x,r.y-headY);if(d<r.r*.65+16){rocks.splice(i,1);energy-=22;addDust(x,headY,'#f87171',22);pop('ROCK HIT');if(energy<=0)return finish()}else if(r.y<-100)rocks.splice(i,1)}for(let i=waters.length-1;i>=0;i--){let w=waters[i],d=Math.hypot(w.x-x,w.y-headY);if(d<w.r+24){waters.splice(i,1);energy=Math.min(100,energy+24);depth+=8;addDust(w.x,w.y,'#5ee7ff',28);pop('+ WATER')}else if(w.y<-100)waters.splice(i,1)}for(const p of dust){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=90*dt}dust=dust.filter(p=>p.life>0);if(depth>best){best=depth;localStorage.rootRushBest=Math.floor(best);bestEl.textContent=Math.floor(best)+'m'}updateHud()}function finish(){over=true;running=false;overlay.classList.remove('hidden');headline.innerHTML='ROOT<br>STOPPED';sub.textContent='Final depth: '+Math.floor(depth)+'m. Try again and chase more glowing water.';start.textContent='DIG AGAIN'}function bg(){let g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#36301e');g.addColorStop(.5,'#1b1710');g.addColorStop(1,'#070605');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(255,255,255,.035)';for(let i=0;i<90;i++){let px=(i*73+scroll*.27)%W,py=(i*137-scroll*.55)%(H+80)-40;ctx.beginPath();ctx.ellipse(px,py,3+(i%8),1+(i%4),0,0,Math.PI*2);ctx.fill()}ctx.strokeStyle='rgba(255,255,255,.17)';ctx.lineWidth=1;for(const m of marks){ctx.beginPath();ctx.moveTo(18,m.y);ctx.lineTo(70,m.y);ctx.stroke();ctx.fillStyle='rgba(255,255,255,.25)';ctx.font='13px Arial';ctx.fillText(m.label+'m',18,m.y-9)}}function rock(r){ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.rot);ctx.fillStyle='#4b4940';ctx.strokeStyle='#1c1a16';ctx.lineWidth=5;ctx.beginPath();for(let i=0;i<7;i++){let a=i/7*Math.PI*2,rr=r.r*(.74+Math.sin(i*2.1)*.13);ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='rgba(255,255,255,.12)';ctx.beginPath();ctx.ellipse(-r.r*.2,-r.r*.12,r.r*.18,r.r*.34,-.5,0,Math.PI*2);ctx.fill();ctx.restore()}function water(w){let grd=ctx.createRadialGradient(w.x-8,w.y-8,2,w.x,w.y,w.r*1.8);grd.addColorStop(0,'#e5ffff');grd.addColorStop(.35,'#5ee7ff');grd.addColorStop(1,'rgba(30,144,255,0)');ctx.fillStyle=grd;ctx.beginPath();ctx.ellipse(w.x,w.y,w.r*1.8,w.r*.95,.45,0,Math.PI*2);ctx.fill()}function drawRoot(){let headY=H*.32;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#8a5528';ctx.lineWidth=13;ctx.beginPath();ctx.moveTo(root.length?root[0].x:x,-30);for(const p of root)ctx.lineTo(p.x,p.y);ctx.lineTo(x,headY);ctx.stroke();ctx.strokeStyle='#c9823c';ctx.lineWidth=6;ctx.stroke();ctx.strokeStyle='rgba(225,180,110,.35)';ctx.lineWidth=2;for(let i=0;i<root.length;i+=9){let p=root[i];ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.quadraticCurveTo(p.x+30*(i%2?1:-1),p.y+10,p.x+46*(i%2?1:-1),p.y+28);ctx.stroke()}let glow=ctx.createRadialGradient(x,headY,4,x,headY,60);glow.addColorStop(0,'rgba(136,255,130,.38)');glow.addColorStop(1,'rgba(136,255,130,0)');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(x,headY,60,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e1a94d';ctx.beginPath();ctx.arc(x,headY,22,0,Math.PI*2);ctx.fill();ctx.fillStyle='#5a2d17';ctx.beginPath();ctx.ellipse(x-7,headY+2,4,8,0,0,Math.PI*2);ctx.ellipse(x+7,headY+2,4,8,0,0,Math.PI*2);ctx.fill()}function draw(){if(!ctx)return;bg();for(const w of waters)water(w);for(const r of rocks)rock(r);drawRoot();for(const p of dust){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}}function pointer(e){let r=canvas.getBoundingClientRect(),t=e.touches?e.touches[0]:e;targetX=t.clientX-r.left}canvas.addEventListener('pointerdown',e=>{targetX=e.offsetX});canvas.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')targetX=e.offsetX});canvas.addEventListener('touchmove',e=>{pointer(e);e.preventDefault()},{passive:false});document.getElementById('left').ontouchstart=e=>{e.preventDefault();left=true};document.getElementById('left').ontouchend=e=>{e.preventDefault();left=false};document.getElementById('right').ontouchstart=e=>{e.preventDefault();right=true};document.getElementById('right').ontouchend=e=>{e.preventDefault();right=false};document.getElementById('left').onmousedown=()=>left=true;document.getElementById('right').onmousedown=()=>right=true;window.onmouseup=()=>{left=false;right=false};window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')left=true;if(e.key==='ArrowRight'||e.key==='d')right=true});window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')left=false;if(e.key==='ArrowRight'||e.key==='d')right=false});start.onclick=begin;window.addEventListener('resize',resize);reset();resize();</script></body></html>
