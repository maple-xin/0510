<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pocket TD Monsters</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #070b14;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      touch-action: none;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #app {
      width: 100vw;
      height: 100vh;
      max-width: 520px;
      background:
        radial-gradient(circle at 50% 16%, rgba(59, 130, 246, 0.16), transparent 34%),
        linear-gradient(180deg, #0d1321 0%, #111827 52%, #070b14 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 14px 12px 12px;
    }

    #topBar {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      z-index: 5;
    }

    .stat {
      height: 38px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 900;
      box-shadow: 0 10px 26px rgba(0,0,0,0.24);
      white-space: nowrap;
    }

    #title {
      margin: 10px 0 8px;
      text-align: center;
      font-size: 24px;
      font-weight: 1000;
      letter-spacing: 2px;
      text-shadow: 0 8px 24px rgba(0,0,0,0.35);
      z-index: 5;
    }

    #gameFrame {
      width: 100%;
      flex: 1;
      min-height: 0;
      position: relative;
      border-radius: 24px;
      padding: 8px;
      border: 1px solid rgba(255,255,255,0.13);
      background: rgba(255,255,255,0.06);
      box-shadow: 0 18px 60px rgba(0,0,0,0.42);
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 18px;
      background: #132033;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.05);
    }

    #hint {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      padding: 7px 13px;
      border-radius: 999px;
      background: rgba(0,0,0,0.30);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.82);
      font-size: 12px;
      font-weight: 900;
      pointer-events: none;
      z-index: 3;
      white-space: nowrap;
    }

    #controls {
      width: 100%;
      margin-top: 10px;
      z-index: 5;
    }

    #towerButtons {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .towerBtn {
      height: 58px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.09);
      color: white;
      font-size: 12px;
      font-weight: 900;
      box-shadow: 0 10px 28px rgba(0,0,0,0.26);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.25;
    }

    .towerBtn.active {
      background: linear-gradient(135deg, #facc15, #fb923c);
      color: #161616;
      border-color: rgba(255,255,255,0.42);
      box-shadow: 0 0 24px rgba(250, 204, 21, 0.28);
    }

    .towerBtn:active,
    .smallBtn:active,
    .mainBtn:active {
      transform: scale(0.96);
    }

    #bottomButtons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    .smallBtn {
      height: 42px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.08);
      color: white;
      font-size: 13px;
      font-weight: 900;
    }

    #overlay {
      position: absolute;
      inset: 8px;
      border-radius: 18px;
      background: rgba(5, 10, 18, 0.82);
      backdrop-filter: blur(10px);
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    #overlay.hidden {
      display: none;
    }

    #overlayBox {
      width: 100%;
      max-width: 360px;
    }

    #overlayTitle {
      margin: 0;
      font-size: 35px;
      line-height: 1.05;
      font-weight: 1000;
      letter-spacing: 1px;
    }

    #overlayText {
      margin: 14px auto 22px;
      color: rgba(255,255,255,0.82);
      font-size: 15px;
      line-height: 1.5;
      max-width: 315px;
    }

    .mainBtn {
      border: none;
      outline: none;
      height: 52px;
      min-width: 168px;
      padding: 0 30px;
      border-radius: 999px;
      background: linear-gradient(135deg, #facc15, #fb923c);
      color: #151515;
      font-size: 18px;
      font-weight: 1000;
      box-shadow: 0 12px 34px rgba(251,146,60,0.34);
    }

    #toast {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(0,0,0,0.66);
      border: 1px solid rgba(255,255,255,0.14);
      font-size: 13px;
      font-weight: 900;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
      z-index: 20;
      white-space: nowrap;
    }

    #toast.show {
      opacity: 1;
    }

    @media (max-height: 720px) {
      #title {
        margin: 6px 0;
        font-size: 20px;
      }

      .stat {
        height: 34px;
        font-size: 12px;
      }

      .towerBtn {
        height: 48px;
        border-radius: 14px;
        font-size: 11px;
      }

      .smallBtn {
        height: 36px;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="topBar">
      <div class="stat">COINS: <span id="coinsText">120</span></div>
      <div class="stat">WAVE: <span id="waveText">1</span></div>
      <div class="stat">LIVES: <span id="livesText">20</span></div>
    </div>

    <div id="title">MONSTER TD</div>

    <div id="gameFrame">
      <canvas id="game"></canvas>
      <div id="hint">Build towers. Stop real monsters.</div>

      <div id="overlay">
        <div id="overlayBox">
          <h1 id="overlayTitle">MONSTER TD</h1>
          <p id="overlayText">Monsters are no longer simple circles. Build towers on glowing pads and stop bats, wolves, spiders, slimes and goblins.</p>
          <button class="mainBtn" id="startBtn">START</button>
        </div>
      </div>

      <div id="toast">Not enough coins</div>
    </div>

    <div id="controls">
      <div id="towerButtons">
        <button class="towerBtn active" data-type="arrow">ARROW<br>$40</button>
        <button class="towerBtn" data-type="ice">ICE<br>$65</button>
        <button class="towerBtn" data-type="bomb">BOMB<br>$90</button>
      </div>
      <div id="bottomButtons">
        <button class="smallBtn" id="waveBtn">NEXT WAVE</button>
        <button class="smallBtn" id="restartBtn">PLAY AGAIN</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const coinsText = document.getElementById("coinsText");
    const waveText = document.getElementById("waveText");
    const livesText = document.getElementById("livesText");
    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlayTitle");
    const overlayText = document.getElementById("overlayText");
    const startBtn = document.getElementById("startBtn");
    const waveBtn = document.getElementById("waveBtn");
    const restartBtn = document.getElementById("restartBtn");
    const towerButtons = [...document.querySelectorAll(".towerBtn")];
    const toast = document.getElementById("toast");

    let W = 360;
    let H = 560;
    let dpr = 1;

    let selectedType = "arrow";
    let running = false;
    let gameOver = false;
    let coins = 120;
    let lives = 20;
    let wave = 1;
    let waveActive = false;
    let spawnLeft = 0;
    let spawnTimer = 0;
    let lastTime = 0;
    let enemies = [];
    let towers = [];
    let bullets = [];
    let floaters = [];
    let shake = 0;

    const towerData = {
      arrow: { cost: 40, range: 122, fireRate: 0.48, damage: 18, color: "#38bdf8" },
      ice: { cost: 65, range: 108, fireRate: 0.86, damage: 9, color: "#a78bfa", slow: 0.55 },
      bomb: { cost: 90, range: 94, fireRate: 1.18, damage: 42, color: "#fb7185", splash: 48 }
    };

    const monsterTypes = [
      { kind: "slime", hp: 46, speed: 48, reward: 10, scale: 1.0 },
      { kind: "bat", hp: 36, speed: 68, reward: 12, scale: 0.95 },
      { kind: "wolf", hp: 64, speed: 52, reward: 15, scale: 1.05 },
      { kind: "spider", hp: 78, speed: 44, reward: 18, scale: 1.08 },
      { kind: "goblin", hp: 96, speed: 40, reward: 24, scale: 1.12 }
    ];

    const path = [
      { x: 0.02, y: 0.19 },
      { x: 0.30, y: 0.19 },
      { x: 0.30, y: 0.43 },
      { x: 0.68, y: 0.43 },
      { x: 0.68, y: 0.68 },
      { x: 0.38, y: 0.68 },
      { x: 0.38, y: 0.86 },
      { x: 0.98, y: 0.86 }
    ];

    const pads = [
      { x: 0.17, y: 0.34 },
      { x: 0.47, y: 0.27 },
      { x: 0.79, y: 0.30 },
      { x: 0.16, y: 0.56 },
      { x: 0.52, y: 0.56 },
      { x: 0.84, y: 0.57 },
      { x: 0.20, y: 0.78 },
      { x: 0.60, y: 0.79 },
      { x: 0.82, y: 0.73 }
    ];

    function resize() {
      const rect = canvas.getBoundingClientRect();
      dpr = window.devicePixelRatio || 1;
      W = Math.max(280, Math.floor(rect.width));
      H = Math.max(360, Math.floor(rect.height));
      canvas.width = Math.floor(W * dpr);
      canvas.height = Math.floor(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      draw();
    }

    function pxPoint(p) {
      return { x: p.x * W, y: p.y * H };
    }

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 900);
    }

    function resetGame() {
      coins = 120;
      lives = 20;
      wave = 1;
      waveActive = false;
      spawnLeft = 0;
      spawnTimer = 0;
      enemies = [];
      towers = [];
      bullets = [];
      floaters = [];
      shake = 0;
      running = false;
      gameOver = false;
      updateUI();
      draw();
    }

    function beginGame() {
      resetGame();
      running = true;
      overlay.classList.add("hidden");
      startWave();
      lastTime = performance.now();
      requestAnimationFrame(loop);
    }

    function updateUI() {
      coinsText.textContent = Math.max(0, Math.floor(coins));
      livesText.textContent = Math.max(0, Math.floor(lives));
      waveText.textContent = wave;
    }

    function startWave() {
      if (!running || gameOver || waveActive) return;
      waveActive = true;
      spawnLeft = 7 + wave * 3;
      spawnTimer = 0;
      waveBtn.textContent = "WAVE ACTIVE";
      showToast("Monster wave " + wave);
    }

    function chooseMonster() {
      const unlocked = Math.min(monsterTypes.length, 1 + Math.floor((wave - 1) / 2));
      const pool = monsterTypes.slice(0, unlocked);
      if (Math.random() < 0.18 && wave > 2) return monsterTypes[Math.min(monsterTypes.length - 1, Math.floor(wave / 2))];
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function spawnEnemy() {
      const mt = chooseMonster();
      const hp = mt.hp + wave * 12;
      const speed = mt.speed + wave * 2.2;
      const first = pxPoint(path[0]);
      enemies.push({
        kind: mt.kind,
        segment: 0,
        t: 0,
        x: first.x,
        y: first.y,
        hp,
        maxHp: hp,
        speed,
        slowTime: 0,
        reward: mt.reward + Math.floor(wave / 2),
        scale: mt.scale,
        bob: Math.random() * Math.PI * 2,
        facing: 1,
        hitFlash: 0
      });
    }

    function updateSpawn(dt) {
      if (!waveActive || spawnLeft <= 0) return;
      spawnTimer -= dt;

      if (spawnTimer <= 0) {
        spawnEnemy();
        spawnLeft -= 1;
        spawnTimer = Math.max(0.38, 1.02 - wave * 0.025);
      }
    }

    function updateEnemies(dt) {
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.bob += dt * 6;
        if (e.hitFlash > 0) e.hitFlash -= dt;

        if (e.hp <= 0) {
          coins += e.reward;
          floaters.push({ x: e.x, y: e.y, text: "+$" + e.reward, life: 0.75 });
          enemies.splice(i, 1);
          continue;
        }

        if (e.segment >= path.length - 1) {
          lives -= 1;
          shake = 0.18;
          enemies.splice(i, 1);
          if (lives <= 0) endGame();
          continue;
        }

        if (e.slowTime > 0) e.slowTime -= dt;
        const speedMul = e.slowTime > 0 ? 0.55 : 1;
        let remain = e.speed * speedMul * dt;

        while (remain > 0 && e.segment < path.length - 1) {
          const a = pxPoint(path[e.segment]);
          const b = pxPoint(path[e.segment + 1]);
          const segLen = Math.hypot(b.x - a.x, b.y - a.y);
          const posOnSeg = e.t * segLen;
          const left = segLen - posOnSeg;

          if (remain < left) {
            e.t += remain / segLen;
            remain = 0;
          } else {
            remain -= left;
            e.segment += 1;
            e.t = 0;
          }

          if (e.segment >= path.length - 1) break;
        }

        if (e.segment < path.length - 1) {
          const a = pxPoint(path[e.segment]);
          const b = pxPoint(path[e.segment + 1]);
          e.x = a.x + (b.x - a.x) * e.t;
          e.y = a.y + (b.y - a.y) * e.t;
          e.facing = b.x >= a.x ? 1 : -1;
        }
      }

      if (waveActive && spawnLeft <= 0 && enemies.length === 0) {
        waveActive = false;
        coins += 35 + wave * 4;
        floaters.push({ x: W * 0.5, y: H * 0.16, text: "WAVE CLEAR", life: 1.05 });
        wave += 1;
        waveBtn.textContent = "NEXT WAVE";
      }
    }

    function updateTowers(dt) {
      for (const t of towers) {
        t.cool -= dt;
        if (t.cool > 0) continue;

        const data = towerData[t.type];
        let target = null;
        let bestProgress = -1;

        for (const e of enemies) {
          const range = data.range * (1 + (t.level - 1) * 0.13);
          if (Math.hypot(e.x - t.x, e.y - t.y) <= range) {
            const progress = e.segment + e.t;
            if (progress > bestProgress) {
              bestProgress = progress;
              target = e;
            }
          }
        }

        if (!target) continue;

        t.cool = data.fireRate * Math.max(0.72, 1 - (t.level - 1) * 0.09);

        bullets.push({
          x: t.x,
          y: t.y,
          target,
          type: t.type,
          damage: data.damage * (1 + (t.level - 1) * 0.35),
          speed: t.type === "bomb" ? 335 : 440,
          color: data.color,
          splash: data.splash || 0,
          slow: data.slow || 0,
          angle: Math.atan2(target.y - t.y, target.x - t.x),
          spin: 0
        });
      }
    }

    function updateBullets(dt) {
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.spin += dt * 12;

        if (!enemies.includes(b.target) || b.target.hp <= 0) {
          bullets.splice(i, 1);
          continue;
        }

        const dx = b.target.x - b.x;
        const dy = b.target.y - b.y;
        const len = Math.hypot(dx, dy);

        if (len < 13) {
          hitEnemy(b);
          bullets.splice(i, 1);
          continue;
        }

        b.angle = Math.atan2(dy, dx);
        b.x += (dx / len) * b.speed * dt;
        b.y += (dy / len) * b.speed * dt;
      }
    }

    function hitEnemy(b) {
      if (b.splash > 0) {
        for (const e of enemies) {
          if (Math.hypot(e.x - b.target.x, e.y - b.target.y) <= b.splash) {
            e.hp -= b.damage;
            e.hitFlash = 0.12;
          }
        }
        shake = 0.10;
        floaters.push({ x: b.target.x, y: b.target.y, text: "BOOM", life: 0.45 });
      } else {
        b.target.hp -= b.damage;
        b.target.hitFlash = 0.12;
      }

      if (b.slow) {
        b.target.slowTime = 1.5;
        floaters.push({ x: b.target.x, y: b.target.y, text: "FROZEN", life: 0.45 });
      }
    }

    function updateFloaters(dt) {
      for (let i = floaters.length - 1; i >= 0; i--) {
        const f = floaters[i];
        f.life -= dt;
        f.y -= 22 * dt;
        if (f.life <= 0) floaters.splice(i, 1);
      }
      if (shake > 0) shake -= dt;
    }

    function endGame() {
      gameOver = true;
      running = false;
      waveActive = false;
      overlayTitle.textContent = "GAME OVER";
      overlayText.textContent = "The monsters broke through the gate. You reached wave " + wave + ".";
      startBtn.textContent = "PLAY AGAIN";
      overlay.classList.remove("hidden");
    }

    function loop(now) {
      if (!running || gameOver) return;

      const dt = Math.min(0.033, (now - lastTime) / 1000);
      lastTime = now;

      updateSpawn(dt);
      updateEnemies(dt);
      updateTowers(dt);
      updateBullets(dt);
      updateFloaters(dt);
      updateUI();
      draw();

      requestAnimationFrame(loop);
    }

    function drawBackground() {
      ctx.clearRect(0, 0, W, H);

      const bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, "#17253a");
      bg.addColorStop(1, "#0b1220");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      ctx.strokeStyle = "rgba(255,255,255,0.04)";
      ctx.lineWidth = 1;
      const gap = 28;
      for (let x = 0; x <= W; x += gap) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
      }
      for (let y = 0; y <= H; y += gap) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
      }
    }

    function drawPath() {
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      ctx.beginPath();
      path.forEach((p, i) => {
        const pp = pxPoint(p);
        if (i === 0) ctx.moveTo(pp.x, pp.y);
        else ctx.lineTo(pp.x, pp.y);
      });
      ctx.strokeStyle = "rgba(255, 207, 102, 0.25)";
      ctx.lineWidth = 34;
      ctx.stroke();

      ctx.beginPath();
      path.forEach((p, i) => {
        const pp = pxPoint(p);
        if (i === 0) ctx.moveTo(pp.x, pp.y);
        else ctx.lineTo(pp.x, pp.y);
      });
      ctx.strokeStyle = "rgba(245, 158, 11, 0.72)";
      ctx.lineWidth = 22;
      ctx.stroke();

      ctx.beginPath();
      path.forEach((p, i) => {
        const pp = pxPoint(p);
        if (i === 0) ctx.moveTo(pp.x, pp.y);
        else ctx.lineTo(pp.x, pp.y);
      });
      ctx.strokeStyle = "rgba(255,255,255,0.18)";
      ctx.setLineDash([7, 10]);
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.setLineDash([]);

      const start = pxPoint(path[0]);
      const end = pxPoint(path[path.length - 1]);
      drawGate(start.x, start.y, "IN");
      drawGate(end.x, end.y, "GATE");
    }

    function drawGate(x, y, text) {
      ctx.fillStyle = "rgba(0,0,0,0.38)";
      ctx.beginPath();
      ctx.roundRect(x - 29, y - 18, 58, 36, 12);
      ctx.fill();

      ctx.fillStyle = "rgba(255,255,255,0.88)";
      ctx.font = "900 11px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, x, y);
    }

    function drawPads() {
      for (let i = 0; i < pads.length; i++) {
        const p = pxPoint(pads[i]);
        const built = towers.find(t => t.padIndex === i);

        ctx.beginPath();
        ctx.arc(p.x, p.y, 18, 0, Math.PI * 2);
        ctx.fillStyle = built ? "rgba(15,23,42,0.62)" : "rgba(255,255,255,0.10)";
        ctx.fill();

        ctx.strokeStyle = built ? "rgba(255,255,255,0.12)" : "rgba(250,204,21,0.68)";
        ctx.lineWidth = built ? 2 : 3;
        ctx.stroke();

        if (!built) {
          ctx.fillStyle = "rgba(250,204,21,0.72)";
          ctx.font = "900 18px Arial";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("+", p.x, p.y + 1);
        }
      }
    }

    function drawTowers() {
      for (const t of towers) {
        const data = towerData[t.type];

        ctx.beginPath();
        ctx.arc(t.x, t.y, data.range * (1 + (t.level - 1) * 0.13), 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255,255,255,0.023)";
        ctx.fill();

        ctx.save();
        ctx.translate(t.x, t.y);

        ctx.fillStyle = "rgba(0,0,0,0.36)";
        ctx.beginPath();
        ctx.arc(0, 0, 21, 0, Math.PI * 2);
        ctx.fill();

        if (t.type === "arrow") drawArrowTower(0, 0, t.level);
        if (t.type === "ice") drawIceTower(0, 0, t.level);
        if (t.type === "bomb") drawBombTower(0, 0, t.level);

        ctx.restore();
      }
    }

    function drawArrowTower(x, y, level) {
      ctx.fillStyle = "#38bdf8";
      ctx.beginPath();
      ctx.roundRect(x - 12, y - 14, 24, 28, 7);
      ctx.fill();

      ctx.fillStyle = "#e0f2fe";
      ctx.fillRect(x - 2, y - 20, 4, 20);
      ctx.fillStyle = "#0f172a";
      ctx.font = "900 10px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(level, x, y + 4);
    }

    function drawIceTower(x, y, level) {
      ctx.fillStyle = "#a78bfa";
      ctx.beginPath();
      ctx.moveTo(x, y - 20);
      ctx.lineTo(x + 15, y + 3);
      ctx.lineTo(x + 6, y + 18);
      ctx.lineTo(x - 6, y + 18);
      ctx.lineTo(x - 15, y + 3);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = "#e9d5ff";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = "#111827";
      ctx.font = "900 10px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(level, x, y + 4);
    }

    function drawBombTower(x, y, level) {
      ctx.fillStyle = "#fb7185";
      ctx.beginPath();
      ctx.arc(x, y + 1, 16, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#fecdd3";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x + 6, y - 13);
      ctx.quadraticCurveTo(x + 12, y - 22, x + 20, y - 14);
      ctx.stroke();

      ctx.fillStyle = "#111827";
      ctx.font = "900 10px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(level, x, y + 2);
    }

    function drawEnemies() {
      for (const e of enemies) {
        ctx.save();
        const flash = e.hitFlash > 0;
        ctx.translate(e.x, e.y + Math.sin(e.bob) * 2);
        ctx.scale(e.facing * e.scale, e.scale);

        if (flash) {
          ctx.globalAlpha = 0.82;
          ctx.shadowColor = "#ffffff";
          ctx.shadowBlur = 10;
        }

        if (e.kind === "slime") drawSlime(e);
        if (e.kind === "bat") drawBat(e);
        if (e.kind === "wolf") drawWolf(e);
        if (e.kind === "spider") drawSpider(e);
        if (e.kind === "goblin") drawGoblin(e);

        ctx.restore();
        drawHealthBar(e);
      }
    }

    function drawHealthBar(e) {
      const hpPct = Math.max(0, e.hp / e.maxHp);
      const bw = 34;
      ctx.fillStyle = "rgba(0,0,0,0.46)";
      ctx.fillRect(e.x - bw / 2, e.y - 25, bw, 5);
      ctx.fillStyle = e.slowTime > 0 ? "#93c5fd" : "#22c55e";
      ctx.fillRect(e.x - bw / 2, e.y - 25, bw * hpPct, 5);
    }

    function drawSlime(e) {
      ctx.fillStyle = e.slowTime > 0 ? "#93c5fd" : "#22c55e";
      ctx.beginPath();
      ctx.ellipse(0, 4, 17, 13, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "rgba(255,255,255,0.24)";
      ctx.beginPath();
      ctx.arc(-6, -2, 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#052e16";
      ctx.beginPath();
      ctx.arc(-6, 2, 2.4, 0, Math.PI * 2);
      ctx.arc(7, 2, 2.4, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#052e16";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(1, 6, 6, 0.2, Math.PI - 0.2);
      ctx.stroke();
    }

    function drawBat(e) {
      const c = e.slowTime > 0 ? "#93c5fd" : "#7c3aed";
      ctx.fillStyle = c;
      ctx.beginPath();
      ctx.moveTo(-3, 0);
      ctx.quadraticCurveTo(-20, -18, -30, -2);
      ctx.quadraticCurveTo(-19, -6, -15, 8);
      ctx.quadraticCurveTo(-8, 1, -3, 5);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(3, 0);
      ctx.quadraticCurveTo(20, -18, 30, -2);
      ctx.quadraticCurveTo(19, -6, 15, 8);
      ctx.quadraticCurveTo(8, 1, 3, 5);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#4c1d95";
      ctx.beginPath();
      ctx.arc(0, 2, 13, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#fde68a";
      ctx.beginPath();
      ctx.arc(-4, -1, 2, 0, Math.PI * 2);
      ctx.arc(4, -1, 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.moveTo(-4, 7);
      ctx.lineTo(-1, 11);
      ctx.lineTo(2, 7);
      ctx.closePath();
      ctx.fill();
    }

    function drawWolf(e) {
      const fur = e.slowTime > 0 ? "#93c5fd" : "#64748b";
      ctx.fillStyle = fur;
      ctx.beginPath();
      ctx.ellipse(0, 6, 21, 12, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(-14, -3);
      ctx.lineTo(-9, -20);
      ctx.lineTo(-2, -5);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(14, -3);
      ctx.lineTo(9, -20);
      ctx.lineTo(2, -5);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#94a3b8";
      ctx.beginPath();
      ctx.ellipse(7, 4, 13, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#111827";
      ctx.beginPath();
      ctx.arc(-5, 1, 2.4, 0, Math.PI * 2);
      ctx.arc(8, 1, 2.4, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#0f172a";
      ctx.beginPath();
      ctx.arc(16, 5, 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#111827";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-10, 13);
      ctx.lineTo(-13, 19);
      ctx.moveTo(5, 14);
      ctx.lineTo(4, 20);
      ctx.stroke();
    }

    function drawSpider(e) {
      const body = e.slowTime > 0 ? "#93c5fd" : "#111827";
      ctx.strokeStyle = "#020617";
      ctx.lineWidth = 3;
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.moveTo(-7, 3 + i * 4);
        ctx.lineTo(-24, -5 + i * 7);
        ctx.moveTo(7, 3 + i * 4);
        ctx.lineTo(24, -5 + i * 7);
        ctx.stroke();
      }

      ctx.fillStyle = body;
      ctx.beginPath();
      ctx.ellipse(0, 5, 18, 13, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ef4444";
      ctx.beginPath();
      ctx.arc(-6, 1, 2.4, 0, Math.PI * 2);
      ctx.arc(6, 1, 2.4, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#ef4444";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-4, 10);
      ctx.lineTo(0, 13);
      ctx.lineTo(4, 10);
      ctx.stroke();
    }

    function drawGoblin(e) {
      const skin = e.slowTime > 0 ? "#93c5fd" : "#84cc16";
      ctx.fillStyle = skin;
      ctx.beginPath();
      ctx.arc(0, 3, 16, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(-12, -2);
      ctx.lineTo(-27, -10);
      ctx.lineTo(-15, 8);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(12, -2);
      ctx.lineTo(27, -10);
      ctx.lineTo(15, 8);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#365314";
      ctx.beginPath();
      ctx.arc(-6, 0, 2.5, 0, Math.PI * 2);
      ctx.arc(6, 0, 2.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#365314";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-7, 10);
      ctx.quadraticCurveTo(0, 15, 7, 10);
      ctx.stroke();

      ctx.fillStyle = "#fef3c7";
      ctx.beginPath();
      ctx.moveTo(-2, 9);
      ctx.lineTo(0, 13);
      ctx.lineTo(2, 9);
      ctx.closePath();
      ctx.fill();
    }

    function drawBullets() {
      for (const b of bullets) {
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(b.angle);

        if (b.type === "arrow") {
          ctx.fillStyle = "#e0f2fe";
          ctx.beginPath();
          ctx.moveTo(11, 0);
          ctx.lineTo(-8, -4);
          ctx.lineTo(-5, 0);
          ctx.lineTo(-8, 4);
          ctx.closePath();
          ctx.fill();

          ctx.strokeStyle = "#38bdf8";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(-12, 0);
          ctx.lineTo(4, 0);
          ctx.stroke();
        }

        if (b.type === "ice") {
          ctx.rotate(b.spin);
          ctx.strokeStyle = "#ddd6fe";
          ctx.lineWidth = 2.2;
          for (let i = 0; i < 3; i++) {
            ctx.rotate(Math.PI / 3);
            ctx.beginPath();
            ctx.moveTo(-8, 0);
            ctx.lineTo(8, 0);
            ctx.stroke();
          }
          ctx.fillStyle = "#a78bfa";
          ctx.beginPath();
          ctx.arc(0, 0, 3.5, 0, Math.PI * 2);
          ctx.fill();
        }

        if (b.type === "bomb") {
          ctx.fillStyle = "#fb7185";
          ctx.beginPath();
          ctx.arc(0, 0, 7, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = "#fecdd3";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(3, -6);
          ctx.quadraticCurveTo(7, -11, 12, -6);
          ctx.stroke();
        }

        ctx.restore();
      }
    }

    function drawFloaters() {
      for (const f of floaters) {
        ctx.globalAlpha = Math.max(0, Math.min(1, f.life));
        ctx.fillStyle = "#ffffff";
        ctx.font = "900 15px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(f.text, f.x, f.y);
        ctx.globalAlpha = 1;
      }
    }

    function draw() {
      if (!ctx) return;

      ctx.save();
      if (shake > 0) {
        ctx.translate((Math.random() - 0.5) * 5, (Math.random() - 0.5) * 5);
      }

      drawBackground();
      drawPath();
      drawPads();
      drawTowers();
      drawEnemies();
      drawBullets();
      drawFloaters();

      ctx.restore();
    }

    function getPointer(e) {
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches ? e.touches[0] : e;
      return {
        x: (touch.clientX - rect.left) * (W / rect.width),
        y: (touch.clientY - rect.top) * (H / rect.height)
      };
    }

    function handleTap(e) {
      e.preventDefault();
      if (!running || gameOver) return;

      const p = getPointer(e);
      let bestPad = -1;
      let bestDist = 999;

      for (let i = 0; i < pads.length; i++) {
        const pp = pxPoint(pads[i]);
        const d = Math.hypot(p.x - pp.x, p.y - pp.y);
        if (d < bestDist) {
          bestDist = d;
          bestPad = i;
        }
      }

      if (bestPad < 0 || bestDist > 34) return;

      const existing = towers.find(t => t.padIndex === bestPad);

      if (existing) {
        const upgradeCost = 45 + existing.level * 30;
        if (existing.level >= 3) {
          showToast("Max level");
          return;
        }
        if (coins < upgradeCost) {
          showToast("Need $" + upgradeCost);
          return;
        }
        coins -= upgradeCost;
        existing.level += 1;
        floaters.push({ x: existing.x, y: existing.y - 18, text: "UPGRADE", life: 0.75 });
        updateUI();
        return;
      }

      const data = towerData[selectedType];
      if (coins < data.cost) {
        showToast("Need $" + data.cost);
        return;
      }

      const pp = pxPoint(pads[bestPad]);
      coins -= data.cost;
      towers.push({
        padIndex: bestPad,
        type: selectedType,
        x: pp.x,
        y: pp.y,
        level: 1,
        cool: 0
      });
      floaters.push({ x: pp.x, y: pp.y - 24, text: selectedType.toUpperCase(), life: 0.65 });
      updateUI();
    }

    towerButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        selectedType = btn.dataset.type;
        towerButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
      });
    });

    startBtn.addEventListener("click", beginGame);

    restartBtn.addEventListener("click", () => {
      overlayTitle.textContent = "MONSTER TD";
      overlayText.textContent = "Monsters are no longer simple circles. Build towers on glowing pads and stop bats, wolves, spiders, slimes and goblins.";
      startBtn.textContent = "START";
      beginGame();
    });

    waveBtn.addEventListener("click", () => {
      if (!running) return;
      if (waveActive) {
        showToast("Wave is active");
      } else {
        startWave();
      }
    });

    canvas.addEventListener("click", handleTap);
    canvas.addEventListener("touchstart", handleTap, { passive: false });

    document.addEventListener("touchmove", e => e.preventDefault(), { passive: false });
    window.addEventListener("resize", resize);

    resetGame();
    resize();
  </script>
</body>
</html>
